<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BilimSari — Kirish</title>
  <link rel="icon" type="image/png" href="assets/logo-icon-32.png">
  <link rel="apple-touch-icon" href="assets/logo-icon-64.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }

    .login-page {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .brand {
      display: inline-block;
      margin-bottom: 28px;
      line-height: 1;
    }

    .brand-full {
      height: 52px;
      width: auto;
      display: block;
    }

    .brand-icon {
      display: none; /* qisqa joylar (navbar, mobile menu va h.k.) uchun ishlatiladi */
      height: 40px;
      width: auto;
    }

    .subtitle {
      margin: 0 0 40px;
      color: #737373;
      font-size: 16px;
    }

    .login-card {
      width: 100%;
      border: 1px solid #e1e1e1;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 5px rgba(0,0,0,.04);
      text-align: left;
    }

    .google-btn {
      width: 100%;
      height: 49px;
      border: 1px solid #dedede;
      border-radius: 7px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s ease;
    }

    .google-btn:hover { background: #fafafa; box-shadow: 0 2px 7px rgba(0,0,0,.06); }

    .google-icon { width: 18px; height: 18px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: #737373;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #dedede;
      flex: 1;
    }

    .field { margin-bottom: 17px; }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    .forgot {
      color: #111;
      text-decoration: none;
      font-size: 12px;
    }

    .forgot:hover { text-decoration: underline; }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
      width: 18px;
      height: 18px;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #dedede;
      border-radius: 7px;
      outline: none;
      padding: 0 14px 0 40px;
      font-size: 14px;
      color: #111;
      transition: .2s ease;
    }

    input:focus {
      border-color: #111;
      box-shadow: 0 0 0 2px rgba(0,0,0,.04);
    }

    input::placeholder { color: #8a8a8a; }

    .login-btn {
      width: 100%;
      height: 49px;
      margin-top: 2px;
      border: 0;
      border-radius: 7px;
      background: #171717;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .login-btn:hover { background: #000; }

    .register {
      margin: 26px 0 0;
      text-align: center;
      color: #737373;
      font-size: 13px;
    }

    .register a {
      color: #111;
      font-weight: 700;
      text-decoration: none;
    }

    .register a:hover { text-decoration: underline; }

    @media (max-width: 560px) {
      body { padding: 22px 16px; }
      .brand-full { height: 42px; }
      .subtitle { margin-bottom: 30px; }
      .login-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <div class="brand">
      <!-- To'liq logo (matn bilan) -->
      <img src="assets/logo-full.png" alt="BilimSari" class="brand-full">
      <!-- Qisqa joylar uchun faqat kitob ikonkasi -->
      <img src="assets/logo-icon.png" alt="BilimSari" class="brand-icon">
    </div>
    <p class="subtitle">Hisobingizga kiring</p>

    <section class="login-card">
      <button class="google-btn" type="button" onclick="googleLogin()">
        <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-1.99 3.02v2.51h3.22c1.88-1.73 2.99-4.28 2.99-7.36Z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.61-2.41l-3.22-2.51c-.9.6-2.04.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.06v2.59A9.99 9.99 0 0 0 12 22Z"/>
          <path fill="#FBBC05" d="M6.39 13.91A6.01 6.01 0 0 1 6.07 12c0-.66.11-1.3.32-1.91V7.5H3.06A10 10 0 0 0 2 12c0 1.61.39 3.13 1.06 4.5l3.33-2.59Z"/>
          <path fill="#EA4335" d="M12 5.96c1.47 0 2.79.51 3.83 1.51l2.87-2.87C16.96 2.97 14.7 2 12 2a9.99 9.99 0 0 0-8.94 5.5l3.33 2.59C7.18 7.72 9.39 5.96 12 5.96Z"/>
        </svg>
        Google orqali davom etish
      </button>

      <div class="divider"><span>YOKI</span></div>

      <form onsubmit="login(event)">
        <div class="field">
          <div class="label-row"><label for="email">Email</label></div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input id="email" type="email" placeholder="siz@example.com" required>
          </div>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Parol</label>
            <a class="forgot" href="#">Parolni unutdingizmi?</a>
          </div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" type="password" placeholder="••••••••" required>
          </div>
        </div>

        <button class="login-btn" type="submit">Kirish</button>
      </form>
    </section>

    <p class="register">Hisobingiz yo‘qmi? <a href="#">Ro‘yxatdan o‘tish</a></p>
  </main>

  <script>
    function googleLogin() {
      alert('Google orqali kirish keyingi bosqichda ulanadi.');
    }

    function login(event) {
      event.preventDefault();
      alert('Login tizimi keyingi bosqichda backend bilan ulanadi.');
    }
  </script>
</body>
</html>
