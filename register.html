<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BilimSari — Ro‘yxatdan o‘tish</title>
  <link rel="icon" type="image/png" href="assets/logo-icon-32.png">
  <link rel="apple-touch-icon" href="assets/logo-icon-64.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }

    .login-page {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .brand {
      display: inline-block;
      margin-bottom: 28px;
      line-height: 1;
    }

    .brand-full {
      height: 52px;
      width: auto;
      display: block;
    }

    .subtitle {
      margin: 0 0 40px;
      color: #737373;
      font-size: 16px;
    }

    .login-card {
      width: 100%;
      border: 1px solid #e1e1e1;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 5px rgba(0,0,0,.04);
      text-align: left;
    }

    .field { margin-bottom: 17px; }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
      width: 18px;
      height: 18px;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #dedede;
      border-radius: 7px;
      outline: none;
      padding: 0 14px 0 40px;
      font-size: 14px;
      color: #111;
      transition: .2s ease;
    }

    input:focus {
      border-color: #111;
      box-shadow: 0 0 0 2px rgba(0,0,0,.04);
    }

    input::placeholder { color: #8a8a8a; }

    .login-btn {
      width: 100%;
      height: 49px;
      margin-top: 2px;
      border: 0;
      border-radius: 7px;
      background: #171717;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .login-btn:hover { background: #000; }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .error-msg.show { display: block; }

    .register {
      margin: 26px 0 0;
      text-align: center;
      color: #737373;
      font-size: 13px;
    }

    .register a {
      color: #111;
      font-weight: 700;
      text-decoration: none;
    }

    .register a:hover { text-decoration: underline; }

    @media (max-width: 560px) {
      body { padding: 22px 16px; }
      .brand-full { height: 42px; }
      .subtitle { margin-bottom: 30px; }
      .login-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <a href="index.html" class="brand">
      <img src="assets/logo-full.png" alt="BilimSari" class="brand-full">
    </a>
    <p class="subtitle">Yangi hisob yarating</p>

    <section class="login-card">
      <div id="error" class="error-msg"></div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="field">
          <div class="label-row"><label for="name">Ism</label></div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
            <input id="name" type="text" placeholder="Ismingiz" required autocomplete="name">
          </div>
        </div>

        <div class="field">
          <div class="label-row"><label for="email">Email</label></div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
            </svg>
            <input id="email" type="email" placeholder="siz@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="field">
          <div class="label-row"><label for="password">Parol</label></div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input id="password" type="password" placeholder="Kamida 6 ta belgi" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <div class="field">
          <div class="label-row"><label for="password2">Parolni tasdiqlang</label></div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input id="password2" type="password" placeholder="Parolni qayta kiriting" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <button class="login-btn" type="submit" id="submitBtn">Ro‘yxatdan o‘tish</button>
      </form>
    </section>

    <p class="register">Allaqachon hisobingiz bormi? <a href="login.html">Kirish</a></p>
  </main>

  <script src="js/auth.js"></script>
  <script>
    // Agar allaqachon kirgan bo‘lsa — dashboardga
    redirectIfLoggedIn();

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.add('show');
    }

    function hideError() {
      document.getElementById('error').classList.remove('show');
    }

    function handleRegister(e) {
      e.preventDefault();
      hideError();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (password !== password2) {
        showError('Parollar bir xil emas');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Kutilmoqda...';

      // Kichik kechikish — real his qilish uchun
      setTimeout(() => {
        const result = register(name, email, password);
        if (result.ok) {
          window.location.href = 'dashboard.html';
        } else {
          showError(result.error);
          btn.disabled = false;
          btn.textContent = 'Ro‘yxatdan o‘tish';
        }
      }, 400);
    }
  </script>
</body>
</html>
