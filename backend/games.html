<!DOCTYPE html>
<html lang="uz">
<head>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/games.css">
</head>
<body>

<div class="ustki">
  <button class="orqaga" type="button" id="orqagaTugma" aria-label="Orqaga">←</button>
  <h1 id="sarlavha">O'yinlar</h1>
  <span id="ustkiOng"></span>
</div>
<div class="oy-lenta" id="oyLenta" role="status" aria-live="polite" hidden></div>

<main class="sahifa oy-sahifa" id="ekran">
  <div class="skelet" style="height:52px;margin-bottom:14px"></div>
  <div class="skelet" style="height:120px;margin-bottom:12px"></div>
  <div class="skelet" style="height:170px"></div>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script src="js/games/core.js?v=4"></script>
<script src="js/games/hub.js?v=4"></script>
<script>
(async function () {
  if (!(await UI.sessiyaKerak())) return;
  UI.navChiz('games.html');

  // Botdagi taklif tugmasi: games.html?kod=AB7K92 → o'sha roomga
  var kod = (new URLSearchParams(location.search).get('kod') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (kod.length === 6) history.replaceState(null, '', location.pathname + '#room/' + kod);

  Games.render();
})();
</script>
</body>
