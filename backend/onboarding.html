<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Boshlash — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
<style>
  .ob { max-width: 560px; margin: 0 auto; padding: 24px 16px 36px; }
  .ob h1 { font-size: 22px; margin-bottom: 6px; }
  .ob .kirish-tavsif { color: var(--matn-2); font-size: 14px; margin-bottom: 22px; }
  .tanlangan-panel {
    position: sticky;
    bottom: 0;
    padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--fon) 72%, rgba(243,244,246,0));
    margin-top: 20px;
  }
  /* Tugmalar doim ekran pastida turadi (kontent balandligidan qat'i nazar) */
  .pastki-panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--fon) 78%, rgba(0,0,0,0));
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-sizing: border-box;
  }
  #qadamIsm { padding-bottom: 140px; }
</style>
</head>
<body class="no-nav">

<div class="ob">
  <div class="nuqtalar" aria-hidden="true" id="nuqtalar"></div>

  <!-- Ism -->
  <section class="qadam" id="qadamIsm" aria-labelledby="ismSarlavha">
    <!-- Telegram'dan aniqlangan ism — tasdiqlash yoki o'zgartirish -->
    <div id="ismAniqlanganBlok" hidden>
      <h1>Ismingiz <span id="aniqlanganIsm"></span>?</h1>
      <p class="kirish-tavsif">Sizga shu ism bilan murojaat qilamiz.</p>
    </div>

    <!-- Qo'lda kiritish (mehmon foydalanuvchi YOKI "O'zim kiritaman" bosilganda) -->
    <div id="ismQolBlok" hidden>
      <h1 id="ismSarlavha">Ismingiz nima?</h1>
      <p class="kirish-tavsif">Sizga shu ism bilan murojaat qilamiz.</p>

      <div class="maydon">
        <label for="ism">Ism</label>
        <input class="kiritish" type="text" id="ism" placeholder="Masalan: Dilnoza"
               autocomplete="given-name" maxlength="40">
      </div>
      <p id="ismXato" class="izoh" style="color:var(--qizil);min-height:1.3em;margin:0 0 10px"></p>
    </div>

    <div class="pastki-panel" id="ismAniqlanganTugmalar" hidden>
      <button class="tugma" id="ismTasdiq">Davom etish</button>
      <button class="tugma tugma-ikkilamchi" id="ismOzimKiritaman">O'zim kiritaman</button>
    </div>

    <div class="pastki-panel" id="ismQolTugmalar" hidden>
      <button class="tugma" id="ismDavom">Davom etish</button>
    </div>
  </section>

  <!-- Fan -->
  <section class="qadam" id="qadamFan" aria-labelledby="fanSarlavha">
    <h1 id="fanSarlavha">Qaysi fandan boshlaymiz?</h1>
    <p class="kirish-tavsif" id="fanTavsif">Keyinchalik boshqa fanlarga ham o'tishingiz mumkin.</p>
    <div id="fanlar" class="fanlar"></div>
  </section>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  var qadamlar = ['qadamIsm', 'qadamFan'];

  // ── Sessiya: Telegram bo'lsa avtomatik kirib olamiz ──
  if (!API.kirganmi() && window.BilimSariTG &&
      typeof BilimSariTG.autoAuthIfTelegram === 'function') {
    try { await BilimSariTG.autoAuthIfTelegram(); } catch (e) {}
  }

  document.getElementById('nuqtalar').innerHTML =
    qadamlar.map(function (_, i) {
      return '<i data-nuqta="' + (i + 1) + '"></i>';
    }).join('');

  function qadam(n) {
    qadamlar.forEach(function (id, i) {
      document.getElementById(id).classList.toggle('faol', i === n - 1);
    });
    document.querySelectorAll('[data-nuqta]').forEach(function (el) {
      el.classList.toggle('faol', Number(el.dataset.nuqta) <= n);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function fanQadami() { return qadamlar.indexOf('qadamFan') + 1; }

  // ── Ism qadami ──
  var aniqlanganBlok = document.getElementById('ismAniqlanganBlok');
  var qolBlok = document.getElementById('ismQolBlok');
  var aniqlanganTugmalar = document.getElementById('ismAniqlanganTugmalar');
  var qolTugmalar = document.getElementById('ismQolTugmalar');
  var ismMaydon = document.getElementById('ism');
  var ismXato = document.getElementById('ismXato');

  var joriyIsm = API.kirganmi() ? ((API.user() || {}).name || null) : null;

  function ismQolKiritishniKo_rsat(oldindanTo_ldirilgan) {
    aniqlanganBlok.hidden = true;
    aniqlanganTugmalar.hidden = true;
    qolBlok.hidden = false;
    qolTugmalar.hidden = false;
    if (oldindanTo_ldirilgan) ismMaydon.value = oldindanTo_ldirilgan;
    setTimeout(function () { ismMaydon.focus(); }, 100);
  }

  if (joriyIsm) {
    document.getElementById('aniqlanganIsm').textContent = joriyIsm;
    aniqlanganBlok.hidden = false;
    aniqlanganTugmalar.hidden = false;
  } else {
    ismQolKiritishniKo_rsat();
  }

  document.getElementById('ismOzimKiritaman').onclick = function () {
    ismQolKiritishniKo_rsat(joriyIsm);
  };

  document.getElementById('ismTasdiq').onclick = function () {
    qadam(fanQadami());
    fanlarniYukla();
  };

  async function ismSaqla() {
    var ism = ismMaydon.value.trim();
    ismXato.textContent = '';

    if (ism.length < 2) {
      ismXato.textContent = 'Ismingizni to\'liq yozing.';
      ismMaydon.focus();
      return;
    }

    var tugma = document.getElementById('ismDavom');
    tugma.disabled = true;
    tugma.textContent = 'Saqlanmoqda...';

    var res;
    if (API.kirganmi()) {
      // Telegram foydalanuvchisi ismini o'zi kiritmoqchi
      res = await API.ismYangilash(ism);
    } else {
      // Mehmon — yangi hisob, faqat ism bilan
      res = await API.mehmon(ism);
    }

    tugma.disabled = false;
    tugma.textContent = 'Davom etish';

    if (!res.ok) { ismXato.textContent = res.error; return; }

    if (res.token) {
      API.sessiyaOchish(res.token, res.user);
    } else {
      API.userYangilash({ name: ism });
    }

    qadam(fanQadami());
    fanlarniYukla();
  }

  document.getElementById('ismDavom').onclick = ismSaqla;
  ismMaydon.onkeydown = function (e) { if (e.key === 'Enter') ismSaqla(); };

  // ── Fan qadami ──
  async function fanlarniYukla() {
    var quti = document.getElementById('fanlar');
    quti.style.gridTemplateColumns = '1fr';
    quti.innerHTML = UI.yuklanmoqda('Fanlar yuklanmoqda...');

    var res = await API.fanlar();
    if (!res.ok) {
      quti.innerHTML = UI.xatoHolat(res.error, fanlarniYukla);
      return;
    }

    document.getElementById('fanTavsif').textContent =
      res.subjects.length + ' ta fan mavjud.';

    if (!res.subjects.length) {
      quti.innerHTML = UI.holat({
        belgi: 'tools',
        sarlavha: 'Fanlar tayyorlanmoqda',
        matn: res.empty_message || 'Tez orada qo\'shiladi.',
      });
      return;
    }

    quti.style.gridTemplateColumns = '';
    quti.innerHTML = res.subjects.map(function (f) {
      return '<a class="fan" href="topics.html?fan=' + encodeURIComponent(f.key) + '">' +
        '<span class="belgi">' + UI.nishon(f.icon) + '</span>' +
        '<h3>' + UI.esc(f.name) + '</h3>' +
        '<p class="holat">' + f.total_topics + ' ta mavzu</p></a>';
    }).join('');
  }

  qadam(1);
})();
</script>
</body>
</html>
