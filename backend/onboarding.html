<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Boshlash — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
<style>
  .ob { max-width: 560px; margin: 0 auto; padding: 24px 16px 36px; }
  .ob h1 { font-size: 22px; margin-bottom: 6px; }
  .ob .kirish-tavsif { color: var(--matn-2); font-size: 14px; margin-bottom: 22px; }
  .tanlangan-panel {
    position: sticky;
    bottom: 0;
    padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--fon) 72%, rgba(243,244,246,0));
    margin-top: 20px;
  }
</style>
</head>
<body class="no-nav">

<div class="ob">
  <div class="nuqtalar" aria-hidden="true" id="nuqtalar"></div>

  <!-- Ism (faqat sessiya bo'lmaganda) -->
  <section class="qadam" id="qadamIsm" aria-labelledby="ismSarlavha">
    <h1 id="ismSarlavha">Ismingiz nima?</h1>
    <p class="kirish-tavsif">Sizga shu ism bilan murojaat qilamiz.</p>

    <div class="maydon">
      <label for="ism">Ism</label>
      <input class="kiritish" type="text" id="ism" placeholder="Masalan: Dilnoza"
             autocomplete="given-name" maxlength="40">
    </div>
    <p id="ismXato" class="izoh" style="color:var(--qizil);min-height:1.3em;margin:0 0 10px"></p>

    <button class="tugma" id="ismDavom">Davom etish</button>

    <p class="izoh-kichik" style="text-align:center;margin-top:16px">
      Email bilan hisobingiz bormi? <a href="login.html"><b>Kirish</b></a>
    </p>
  </section>

  <!-- Sinf -->
  <section class="qadam" id="qadamSinf" aria-labelledby="sinfSarlavha">
    <h1 id="sinfSarlavha">Nechinchi sinfda o'qiysiz?</h1>
    <p class="kirish-tavsif">Sizga faqat o'z sinfingiz darslari ko'rsatiladi.</p>

    <div id="sinflar" class="sinflar" role="group" aria-label="Sinflar">
      <div class="skelet" style="height:76px"></div>
      <div class="skelet" style="height:76px"></div>
      <div class="skelet" style="height:76px"></div>
      <div class="skelet" style="height:76px"></div>
      <div class="skelet" style="height:76px"></div>
      <div class="skelet" style="height:76px"></div>
    </div>

    <div class="tanlangan-panel">
      <button class="tugma" id="sinfDavom" disabled>Davom etish</button>
    </div>
  </section>

  <!-- Fan -->
  <section class="qadam" id="qadamFan" aria-labelledby="fanSarlavha">
    <button class="orqaga" id="orqagaSinf" aria-label="Sinf tanlashga qaytish"
            style="margin-bottom:16px">←</button>
    <h1 id="fanSarlavha">Qaysi fandan boshlaymiz?</h1>
    <p class="kirish-tavsif" id="fanTavsif">Keyinchalik boshqa fanlarga ham o'tishingiz mumkin.</p>
    <div id="fanlar" class="fanlar"></div>
  </section>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  var tanlanganSinf = null;
  var qadamlar = [];   // ko'rsatiladigan qadamlar ketma-ketligi

  // ── Sessiya: Telegram bo'lsa avtomatik, aks holda ism so'raymiz ──
  if (!API.kirganmi() && window.BilimSariTG &&
      typeof BilimSariTG.autoAuthIfTelegram === 'function') {
    try { await BilimSariTG.autoAuthIfTelegram(); } catch (e) {}
  }

  qadamlar = API.kirganmi()
    ? ['qadamSinf', 'qadamFan']
    : ['qadamIsm', 'qadamSinf', 'qadamFan'];

  document.getElementById('nuqtalar').innerHTML =
    qadamlar.map(function (_, i) {
      return '<i data-nuqta="' + (i + 1) + '"></i>';
    }).join('');

  function qadam(n) {
    qadamlar.forEach(function (id, i) {
      document.getElementById(id).classList.toggle('faol', i === n - 1);
    });
    document.querySelectorAll('[data-nuqta]').forEach(function (el) {
      el.classList.toggle('faol', Number(el.dataset.nuqta) <= n);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function sinfQadami() { return qadamlar.indexOf('qadamSinf') + 1; }
  function fanQadami() { return qadamlar.indexOf('qadamFan') + 1; }

  // ── Ism qadami (sessiyasiz foydalanuvchi uchun) ──
  var ismMaydon = document.getElementById('ism');
  var ismXato = document.getElementById('ismXato');

  async function ismSaqla() {
    var ism = ismMaydon.value.trim();
    ismXato.textContent = '';

    if (ism.length < 2) {
      ismXato.textContent = 'Ismingizni to\'liq yozing.';
      ismMaydon.focus();
      return;
    }

    var tugma = document.getElementById('ismDavom');
    tugma.disabled = true;
    tugma.textContent = 'Saqlanmoqda...';

    var res = await API.mehmon(ism);

    tugma.disabled = false;
    tugma.textContent = 'Davom etish';

    if (!res.ok) { ismXato.textContent = res.error; return; }

    API.sessiyaOchish(res.token, res.user);
    qadam(sinfQadami());
    sinflarniYukla();
  }

  document.getElementById('ismDavom').onclick = ismSaqla;
  ismMaydon.onkeydown = function (e) { if (e.key === 'Enter') ismSaqla(); };

  // ── Sinf qadami ──
  async function sinflarniYukla() {
    var quti = document.getElementById('sinflar');
    var javob = await API.sinflar();

    if (!javob.ok) {
      quti.style.gridTemplateColumns = '1fr';
      quti.innerHTML = UI.xatoHolat(javob.error, function () { sinflarniYukla(); });
      return;
    }

    quti.style.gridTemplateColumns = '';
    quti.innerHTML = javob.grades.map(function (s) {
      return '<button type="button" class="sinf-tugma' + (s.available ? ' tayyor' : '') + '"' +
        ' data-sinf="' + s.grade + '" aria-pressed="false">' + s.grade +
        '<span>' + (s.available ? s.topic_count + ' mavzu' : 'tayyorlanmoqda') + '</span></button>';
    }).join('');
  }

  document.getElementById('sinflar').addEventListener('click', function (e) {
    var t = e.target.closest('.sinf-tugma');
    if (!t) return;
    this.querySelectorAll('.sinf-tugma').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b === t));
    });
    tanlanganSinf = Number(t.dataset.sinf);
    document.getElementById('sinfDavom').disabled = false;
  });

  document.getElementById('sinfDavom').onclick = async function () {
    if (!tanlanganSinf) return;
    this.disabled = true;
    this.textContent = 'Saqlanmoqda...';

    var res = await API.sinfTanlash(tanlanganSinf);
    this.disabled = false;
    this.textContent = 'Davom etish';

    if (!res.ok) { UI.xabar(res.error, 'xato'); return; }

    API.userYangilash({ grade: tanlanganSinf });
    qadam(fanQadami());
    fanlarniYukla();
  };

  document.getElementById('orqagaSinf').onclick = function () { qadam(sinfQadami()); };

  // ── Fan qadami ──
  async function fanlarniYukla() {
    var quti = document.getElementById('fanlar');
    quti.style.gridTemplateColumns = '1fr';
    quti.innerHTML = UI.yuklanmoqda('Fanlar yuklanmoqda...');

    var res = await API.fanlar();
    if (!res.ok) {
      quti.innerHTML = UI.xatoHolat(res.error, fanlarniYukla);
      return;
    }

    document.getElementById('fanTavsif').textContent =
      tanlanganSinf + '-sinf uchun ' + res.subjects.length + ' ta fan mavjud.';

    if (!res.subjects.length) {
      quti.innerHTML = UI.holat({
        belgi: 'tools',
        sarlavha: 'Bu sinf uchun darslar tayyorlanmoqda',
        matn: res.empty_message || 'Tez orada qo\'shiladi. Boshqa sinfni tanlab ko\'rishingiz mumkin.',
      }) + '<button class="tugma tugma-ikkilamchi" id="boshqaSinf" style="margin-top:12px">' +
        'Boshqa sinfni tanlash</button>';
      document.getElementById('boshqaSinf').onclick = function () { qadam(sinfQadami()); };
      return;
    }

    quti.style.gridTemplateColumns = '';
    quti.innerHTML = res.subjects.map(function (f) {
      return '<a class="fan" href="topics.html?fan=' + encodeURIComponent(f.key) + '">' +
        '<span class="belgi">' + UI.nishon(f.icon) + '</span>' +
        '<h3>' + UI.esc(f.name) + '</h3>' +
        '<p class="holat">' + f.total_topics + ' ta mavzu</p></a>';
    }).join('');
  }

  // ── Boshlash ──
  if (API.kirganmi()) {
    qadam(sinfQadami());
    sinflarniYukla();
  } else {
    qadam(1);
    setTimeout(function () { ismMaydon.focus(); }, 150);
  }
})();
</script>
</body>
</html>
