<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>BilimSari — bilim sari birinchi qadam</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<style>
  .kirish-ekran {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--fon);
  }
  .kirish-ichi {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px 120px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .nishon-katta {
    width: 76px; height: 76px;
    border-radius: 22px;
    margin: 0 auto 20px;
    box-shadow: 0 5px 0 var(--yashil-quyuq);
    overflow: hidden;
  }
  .nishon-katta img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .kirish-ichi h1 {
    font-size: clamp(28px, 8vw, 34px);
    line-height: 1.15;
    margin-bottom: 12px;
    text-align: center;
  }
  .kirish-ichi h1 em {
    font-style: normal;
    color: var(--yashil);
  }
  .kirish-tavsif {
    color: var(--matn-2);
    font-size: 15px;
    max-width: 34ch;
    margin-bottom: 26px;
  }

  .xususiyatlar {
    list-style: none;
    margin: 0 0 28px;
    display: grid;
    gap: 10px;
  }
  .xususiyatlar li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--oq);
    border: 1px solid var(--chiziq);
    border-radius: var(--r-katta);
    padding: 13px 14px;
    font-size: 13px;
    color: var(--matn-2);
  }
  .xususiyatlar .nishon {
    width: 36px; height: 36px;
    border-radius: 11px;
    background: var(--yashil-fon);
    color: var(--yashil);
  }
  .xususiyatlar .nishon svg { width: 20px; height: 20px; }
  .xususiyatlar b {
    display: block;
    color: var(--matn-quyuq);
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 1px;
  }

  .tekshirilmoqda {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: var(--fon);
    color: var(--matn-2);
    font-weight: 700;
  }

  /* Tugma doim ekran pastida turadi */
  .pastki-panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--fon) 78%, rgba(0,0,0,0));
    box-sizing: border-box;
  }
  .pastki-panel[hidden] { display: none; }
</style>
</head>
<body class="no-nav">

<div id="tekshir" class="tekshirilmoqda">
  <div style="text-align:center">
    <span class="aylana" style="margin:0 auto 12px"></span>
    <div>Yuklanmoqda...</div>
  </div>
</div>

<main class="kirish-ekran" id="ekran" hidden>
  <div class="kirish-ichi">
    <div class="nishon-katta"><img src="assets/logo-green.png" alt="Bilim Sari"></div>

    <h1 style="margin-bottom:32px">Bilim Sari</h1>
  </div>

  <div class="pastki-panel">
    <a class="tugma" href="onboarding.html" id="boshlashTugma">Boshlash</a>
  </div>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/telegram.js"></script>
<script>
document.querySelectorAll('[data-ikon]').forEach(function (el) {
  el.innerHTML = BSIcons.icon(el.dataset.ikon);
});

(async function () {
  // Telegram Mini App ichida bo'lsa — fonda avtomatik kirib olamiz, lekin
  // baribir avval logo + "Bilim Sari" + "Boshlash" ekranini ko'rsatamiz —
  // sinf tanlashga to'g'ridan-to'g'ri otlantirmaymiz.
  if (window.BilimSariTG && typeof BilimSariTG.autoAuthIfTelegram === 'function') {
    try { await BilimSariTG.autoAuthIfTelegram(); } catch (e) {}
  }

  var boshlashTugma = document.getElementById('boshlashTugma');
  if (API.kirganmi()) {
    var d = await API.dashboard();
    if (d.ok) {
      boshlashTugma.setAttribute('href', d.needs_onboarding ? 'onboarding.html' : 'dashboard.html');
    }
  }

  document.getElementById('tekshir').remove();
  document.getElementById('ekran').hidden = false;
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
