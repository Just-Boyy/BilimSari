<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BilimSari</title>
  <meta name="theme-color" content="#58A700">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #fff;
      color: #1a1a1a;
      padding: 24px 20px 32px;
    }
    .box {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .logo {
      height: 56px;
      width: auto;
      margin: 0 auto 18px;
      display: block;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 15px;
      color: #777;
      margin-bottom: 28px;
      line-height: 1.45;
    }
    .btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      background: #58A700;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #3f7d00;
      transition: transform .1s;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3f7d00;
    }
    .btn-ghost {
      background: #fff;
      color: #333;
      border: 2px solid #e5e5e5;
      box-shadow: none;
      margin-top: 12px;
    }
    .btn-ghost:active {
      background: #f5f5f5;
      box-shadow: none;
      transform: none;
    }
    .step { display: none; }
    .step.active { display: block; }

    .name-card {
      background: #f7f7f7;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
      text-align: left;
    }
    .name-card .label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    .name-card .value {
      font-size: 18px;
      font-weight: 700;
    }
    input[type="text"] {
      width: 100%;
      height: 50px;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #58A700; }

    .fan-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin-bottom: 8px;
      max-height: 55vh;
      overflow-y: auto;
    }
    .fan-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 2px solid #eee;
      border-radius: 14px;
      cursor: pointer;
      transition: .15s;
      background: #fff;
    }
    .fan-item:active, .fan-item.selected {
      border-color: #58A700;
      background: #f3faf0;
    }
    .fan-dot {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .fan-item strong {
      display: block;
      font-size: 15px;
    }
    .fan-item span {
      font-size: 12px;
      color: #888;
    }
    .back {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 14px;
      color: #58A700;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <!-- 1. Welcome -->
    <div class="step active" id="stepWelcome">
      <img class="logo" src="/assets/logo-book-icon.png" alt="BilimSari"
           onerror="this.src='/assets/logo-icon.png'">
      <h1>BilimSari</h1>
      <p class="sub">O‘rganishni boshlash uchun davom eting</p>
      <button class="btn" type="button" id="btnStart">Boshlash</button>
    </div>

    <!-- 2. Ism -->
    <div class="step" id="stepName">
      <button type="button" class="back" id="backToWelcome">← Orqaga</button>
      <h1>Ismingiz</h1>
      <p class="sub">Telegramdagi ismingiz topildi. Shu bilan qolsinmi?</p>
      <div class="name-card">
        <div class="label">Telegram ismi</div>
        <div class="value" id="tgNamePreview">—</div>
      </div>
      <button class="btn" type="button" id="btnKeepName">Ha, shu bilan</button>
      <button class="btn btn-ghost" type="button" id="btnOwnName">O‘zim kiritaman</button>
    </div>

    <!-- 2b. Qo‘lda ism -->
    <div class="step" id="stepNameManual">
      <button type="button" class="back" id="backToName">← Orqaga</button>
      <h1>Ism kiriting</h1>
      <p class="sub">Qanday murojaat qilaylik?</p>
      <input type="text" id="inputFirst" placeholder="Ism" autocomplete="given-name">
      <input type="text" id="inputLast" placeholder="Familiya (ixtiyoriy)" autocomplete="family-name">
      <button class="btn" type="button" id="btnSaveName">Davom etish</button>
    </div>

    <!-- 3. Fan -->
    <div class="step" id="stepFan">
      <button type="button" class="back" id="backFromFan">← Orqaga</button>
      <h1>Fan tanlang</h1>
      <p class="sub">Nima fan bo‘yicha o‘qimoqchisiz? Faqat bitta fan.</p>
      <div class="fan-list" id="fanList"></div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/js/telegram.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/data.js"></script>
  <script>
    var ONBOARD_KEY = 'bs_onboarding_v1';
    var selectedName = '';
    var selectedCourse = null;
    var cameFromManual = false;

    function showStep(id) {
      document.querySelectorAll('.step').forEach(function (el) {
        el.classList.toggle('active', el.id === id);
      });
    }

    function getTgDisplayName() {
      try {
        var wa = window.Telegram && Telegram.WebApp;
        if (wa && wa.initDataUnsafe && wa.initDataUnsafe.user) {
          var u = wa.initDataUnsafe.user;
          var n = ((u.first_name || '') + ' ' + (u.last_name || '')).trim();
          return n || u.username || '';
        }
      } catch (e) {}
      var s = getSession && getSession();
      if (s && s.name) return s.name;
      return '';
    }

    function loadOnboarding() {
      try {
        return JSON.parse(localStorage.getItem(ONBOARD_KEY) || 'null');
      } catch (e) {
        return null;
      }
    }

    function saveOnboarding(data) {
      localStorage.setItem(ONBOARD_KEY, JSON.stringify(data));
      if (data.name) {
        localStorage.setItem('bs_display_name', data.name);
        try {
          var g = JSON.parse(localStorage.getItem('bilimsari_game_v1') || '{}');
          g.displayName = data.name;
          localStorage.setItem('bilimsari_game_v1', JSON.stringify(g));
        } catch (e) {}
      }
      if (data.courseId) {
        localStorage.setItem('bs_current_course', data.courseId);
      }
    }

    // Allaqachon o‘tgan bo‘lsa — learn
    (function () {
      var o = loadOnboarding();
      if (o && o.done && o.courseId) {
        localStorage.setItem('bs_current_course', o.courseId);
        window.location.replace('learn.html?course=' + encodeURIComponent(o.courseId));
        return;
      }
    })();

    // Telegram auth (fonda)
    (async function () {
      if (window.BilimSariTG && BilimSariTG.isTelegram()) {
        await BilimSariTG.autoAuthIfTelegram();
        var n = getTgDisplayName();
        if (n) document.getElementById('tgNamePreview').textContent = n;
      } else {
        var n2 = getTgDisplayName();
        document.getElementById('tgNamePreview').textContent = n2 || 'Foydalanuvchi';
      }
      try {
        var wa = window.Telegram && Telegram.WebApp;
        if (wa) { wa.ready(); wa.expand(); }
      } catch (e) {}
    })();

    document.getElementById('btnStart').onclick = function () {
      var n = getTgDisplayName() || 'Foydalanuvchi';
      document.getElementById('tgNamePreview').textContent = n;
      selectedName = n;
      showStep('stepName');
    };

    document.getElementById('backToWelcome').onclick = function () {
      showStep('stepWelcome');
    };

    document.getElementById('btnKeepName').onclick = function () {
      selectedName = document.getElementById('tgNamePreview').textContent || 'Foydalanuvchi';
      cameFromManual = false;
      renderFans();
      showStep('stepFan');
    };

    document.getElementById('btnOwnName').onclick = function () {
      showStep('stepNameManual');
      var parts = (document.getElementById('tgNamePreview').textContent || '').split(' ');
      document.getElementById('inputFirst').value = parts[0] || '';
      document.getElementById('inputLast').value = parts.slice(1).join(' ') || '';
      document.getElementById('inputFirst').focus();
    };

    document.getElementById('backToName').onclick = function () {
      showStep('stepName');
    };

    document.getElementById('btnSaveName').onclick = function () {
      var first = document.getElementById('inputFirst').value.trim();
      var last = document.getElementById('inputLast').value.trim();
      if (first.length < 2) {
        alert('Ism kamida 2 ta belgidan iborat bo‘lsin');
        return;
      }
      selectedName = (first + ' ' + last).trim();
      cameFromManual = true;
      renderFans();
      showStep('stepFan');
    };

    document.getElementById('backFromFan').onclick = function () {
      showStep(cameFromManual ? 'stepNameManual' : 'stepName');
    };

    function fanEmoji(id) {
      var map = {
        english: '🇬🇧', uzbek: '📖', russian: '🇷🇺',
        geography: '🌍', math: '📐', geometry: '📏',
        law: '⚖️', biology: '🧬', literature: '📚'
      };
      return map[id] || '📖';
    }

    function renderFans() {
      var list = document.getElementById('fanList');
      list.innerHTML = '';
      var courses = window.COURSES || [];
      if (!courses.length) {
        list.innerHTML = '<p style="color:#c00;text-align:center">Fanlar yuklanmadi. Sahifani yangilang.</p>';
        return;
      }
      courses.forEach(function (c) {
        var el = document.createElement('div');
        el.className = 'fan-item';
        el.innerHTML =
          '<div class="fan-dot" style="background:' + (c.color || '#58A700') + '22">' +
          fanEmoji(c.id) + '</div>' +
          '<div><strong>' + c.name + '</strong><span>' + (c.desc || '') + '</span></div>';
        el.onclick = function () {
          selectedCourse = c.id;
          finish(c.id);
        };
        list.appendChild(el);
      });
    }

    function finish(courseId) {
      saveOnboarding({
        done: true,
        name: selectedName,
        courseId: courseId,
        at: Date.now()
      });
      window.location.href = 'learn.html?course=' + encodeURIComponent(courseId);
    }
  </script>
</body>
</html>
