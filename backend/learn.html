<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>O‘rganish — BilimSari</title>
  <meta name="theme-color" content="#58A700">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      min-height: 100vh;
      padding-bottom: 88px;
    }
    a { text-decoration: none; color: inherit; }

    /* Top stats */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 14px;
    }
    .topbar-inner {
      max-width: 560px; margin: 0 auto;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .stat {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      font-weight: 800; font-size: 14px;
      background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 12px; padding: 8px 6px;
      cursor: pointer;
    }
    .stat .ico { display: flex; }
    .stat .ico svg { width: 18px; height: 18px; }
    .stat.streak { color: #f59e0b; }
    .stat.xp { color: #eab308; }
    .stat.gems { color: #0ea5e9; }

    .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 24px; }

    /* Course header */
    .course-head {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .course-head h1 {
      font-size: 20px; font-weight: 800; letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .course-head p { color: #6b7280; font-size: 13px; margin-bottom: 12px; }
    .progress-row {
      display: flex; align-items: center; gap: 10px;
    }
    .progress-track {
      flex: 1; height: 10px; background: #e5e7eb; border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg,#58A700,#89e219);
      border-radius: 99px; transition: width .35s ease;
    }
    .progress-pct { font-size: 13px; font-weight: 800; color: #58A700; min-width: 40px; text-align: right; }

    /* Continue CTA */
    .cta {
      display: none;
      width: 100%;
      margin-bottom: 16px;
      border: none;
      border-radius: 16px;
      background: #58A700;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      padding: 16px 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 #3f7d00;
      text-align: left;
    }
    .cta.show { display: block; }
    .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #3f7d00; }
    .cta small { display: block; font-weight: 600; opacity: .9; font-size: 12px; margin-top: 4px; }

    /* Chips */
    .chips {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
      margin-bottom: 8px; -webkit-overflow-scrolling: touch;
    }
    .chip {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid #e5e7eb;
      background: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      color: #374151;
    }
    .chip.active {
      border-color: #58A700;
      background: #f0fdf4;
      color: #3f7d00;
    }

    /* Unit */
    .unit {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 16px 14px 20px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .unit-label {
      font-size: 11px; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; color: #9ca3af; margin-bottom: 4px;
    }
    .unit h2 { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    .unit .udesc { font-size: 13px; color: #6b7280; margin-bottom: 16px; }

    /* Path */
    .path {
      display: flex; flex-direction: column; align-items: center; gap: 0;
    }
    .node-wrap {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; position: relative;
    }
    .node-line {
      width: 4px; height: 22px; background: #e5e7eb; border-radius: 4px;
    }
    .node-line.done { background: #58A700; }
    .node-card {
      width: 100%; max-width: 300px;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 2px solid #e5e7eb;
      background: #fafafa;
      cursor: default;
      transition: .15s;
    }
    .node-card.current {
      border-color: #58A700;
      background: #f0fdf4;
      box-shadow: 0 0 0 4px rgba(88,167,0,.12);
      cursor: pointer;
    }
    .node-card.done {
      border-color: #bbf7d0;
      background: #fff;
      cursor: pointer;
    }
    .node-card.locked { opacity: .55; }
    .node-card.current:active, .node-card.done:active {
      transform: scale(.98);
    }
    .node-btn {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      border: 3px solid #d1d5db;
      background: #fff;
      color: #9ca3af;
    }
    .node-card.current .node-btn {
      border-color: #58A700; background: #58A700; color: #fff;
      animation: pulse 1.8s ease infinite;
    }
    .node-card.done .node-btn {
      border-color: #58A700; background: #dcfce7; color: #58A700;
    }
    .node-btn svg { width: 22px; height: 22px; }
    .node-meta { flex: 1; min-width: 0; }
    .node-meta .ntype {
      font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase;
    }
    .node-card.current .node-meta .ntype { color: #58A700; }
    .node-meta .ntitle {
      font-size: 15px; font-weight: 800; color: #111827;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .node-meta .nstatus {
      font-size: 12px; color: #6b7280; margin-top: 2px;
    }
    .node-card.current .node-meta .nstatus { color: #3f7d00; font-weight: 700; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(88,167,0,.35); }
      50% { box-shadow: 0 0 0 10px rgba(88,167,0,0); }
    }

    /* Empty */
    .empty {
      text-align: center; padding: 40px 16px; color: #6b7280;
    }
    .empty h3 { color: #111; margin-bottom: 8px; }

    /* Bottom nav */
    .bnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: #fff; border-top: 1px solid #e5e7eb;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .bnav-inner {
      max-width: 560px; margin: 0 auto;
      display: flex; justify-content: space-around;
    }
    .bnav a {
      flex: 1; text-align: center; font-size: 11px; font-weight: 700;
      color: #9ca3af; padding: 6px 2px; display: flex; flex-direction: column;
      align-items: center; gap: 2px;
    }
    .bnav a.active { color: #58A700; }
    .nav-ico { display: flex; height: 24px; align-items: center; justify-content: center; }
    .nav-ico svg { width: 22px; height: 22px; }

    /* Modal */
    .modal-bg {
      display: none; position: fixed; inset: 0; z-index: 80;
      background: rgba(0,0,0,.4); align-items: flex-end; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .sheet {
      background: #fff; width: 100%; max-width: 480px;
      border-radius: 20px 20px 0 0; padding: 16px 18px 28px;
    }
    .sheet h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; display:flex; align-items:center; gap:8px; }
    .sheet p { color: #6b7280; font-size: 14px; line-height: 1.45; margin-bottom: 10px; }
    .daily-bar { height: 10px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
    .daily-bar span { display:block; height:100%; background:#eab308; border-radius:99px; }
    .goals { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
    .goal {
      padding: 12px; border: 2px solid #e5e7eb; border-radius: 12px;
      font-weight: 700; cursor: pointer;
    }
    .goal.active { border-color: #58A700; background: #f0fdf4; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <button type="button" class="stat streak" onclick="openStat('streak')">
        <span class="ico" id="icoStreak"></span><span id="sStreak">0</span>
      </button>
      <button type="button" class="stat xp" onclick="openStat('xp')">
        <span class="ico" id="icoXp"></span><span id="sXp">0</span>
      </button>
      <button type="button" class="stat gems" onclick="openStat('gems')">
        <span class="ico" id="icoGems"></span><span id="sGems">0</span>
      </button>
    </div>
  </div>

  <div class="wrap">
    <div class="course-head" id="courseHead">
      <h1 id="courseTitle">Yuklanmoqda...</h1>
      <p id="courseDesc">Fan ma’lumotlari</p>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="courseProg"></div></div>
        <div class="progress-pct" id="coursePct">0%</div>
      </div>
    </div>

    <button type="button" class="cta" id="continueCta">
      Davom etish
      <small id="continueSub">Keyingi dars</small>
    </button>

    <div class="chips" id="chips"></div>
    <div id="units"></div>
  </div>

  <nav class="bnav"><div class="bnav-inner">
    <a href="learn.html" class="active"><span class="nav-ico" data-icon="home"></span><span data-i18n="learn">O‘rganish</span></a>
    <a href="courses.html"><span class="nav-ico" data-icon="book"></span><span data-i18n="courses">Kurslar</span></a>
    <a href="leaderboard.html"><span class="nav-ico" data-icon="trophy"></span><span data-i18n="rating">Reyting</span></a>
    <a href="review.html"><span class="nav-ico" data-icon="refresh"></span><span data-i18n="review">Takrorlash</span></a>
    <a href="profile.html"><span class="nav-ico" data-icon="user"></span><span data-i18n="profile">Profil</span></a>
  </div></nav>

  <div class="modal-bg" id="statModal" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="sheet" id="statSheet"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/js/telegram.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/ai.js"></script>
  <script>
    let courseId = null;
    let COURSES_DATA = [];
    let nextLesson = null;

    function typeLabel(t) {
      return { lesson: 'Dars', practice: 'Mashq', review: 'Test', chest: 'Mukofot' }[t] || 'Dars';
    }

    function statusLabel(st) {
      return { current: 'Hozirgi dars — bosing', done: 'Tugallangan — qayta o‘tish', locked: 'Avvalgi darsni tugating' }[st] || '';
    }

    async function loadCourses() {
      try {
        const res = await fetch('/api/courses');
        const data = await res.json();
        if (data.ok && data.courses && data.courses.length) {
          COURSES_DATA = data.courses;
          window.COURSES = data.courses;
          return true;
        }
      } catch (e) {}
      if (typeof COURSES !== 'undefined' && COURSES.length) {
        COURSES_DATA = COURSES;
        return true;
      }
      return false;
    }

    function getCourse(id) {
      return COURSES_DATA.find(c => c.id === id) || COURSES_DATA[0];
    }

    function lessonState(course, unit, lesson, lessonIndex, unitIndex) {
      const g = getGame();
      const done = isLessonComplete(course.id, lesson.id);
      // sequential unlock across units
      let unlocked = true;
      if (lessonIndex === 0 && unitIndex === 0) unlocked = true;
      else {
        // previous lesson in same unit
        if (lessonIndex > 0) {
          const prev = unit.lessons[lessonIndex - 1];
          unlocked = isLessonComplete(course.id, prev.id);
        } else {
          // first of unit -> last of previous unit
          const prevUnit = course.units[unitIndex - 1];
          const prevLesson = prevUnit.lessons[prevUnit.lessons.length - 1];
          unlocked = isLessonComplete(course.id, prevLesson.id);
        }
      }
      if (done) return 'done';
      if (unlocked) return 'current';
      return 'locked';
    }

    function findNextLesson(course) {
      if (!course || !course.units) return null;
      for (let ui = 0; ui < course.units.length; ui++) {
        const unit = course.units[ui];
        for (let li = 0; li < unit.lessons.length; li++) {
          const lesson = unit.lessons[li];
          const st = lessonState(course, unit, lesson, li, ui);
          if (st === 'current') {
            return { course, unit, lesson, st };
          }
        }
      }
      // all done -> first lesson for review
      const u0 = course.units[0];
      if (u0 && u0.lessons[0]) return { course, unit: u0, lesson: u0.lessons[0], st: 'done' };
      return null;
    }

    function openLesson(courseId, lessonId) {
      location.href = 'lesson.html?course=' + encodeURIComponent(courseId) + '&lesson=' + encodeURIComponent(lessonId);
    }

    function refreshStats() {
      const g = getGame();
      document.getElementById('sStreak').textContent = g.streak || 0;
      document.getElementById('sXp').textContent = g.xp || 0;
      document.getElementById('sGems').textContent = g.gems || 0;
    }

    function openStat(type) {
      const g = getGame();
      const sheet = document.getElementById('statSheet');
      if (type === 'streak') {
        sheet.innerHTML = '<h3>' + icon('flame') + ' ' + (g.streak || 0) + ' kunlik streak</h3>' +
          '<p>Har kuni kamida bitta dars o‘ting — streak saqlanadi.</p>';
      } else if (type === 'xp') {
        const goalPct = Math.min(100, Math.round(((g.dailyXp || 0) / (g.dailyGoal || 20)) * 100));
        sheet.innerHTML = '<h3>' + icon('zap') + ' ' + (g.xp || 0) + ' XP</h3>' +
          '<p>Bugun: ' + (g.dailyXp || 0) + ' / ' + (g.dailyGoal || 20) + ' XP</p>' +
          '<div class="daily-bar"><span style="width:' + goalPct + '%"></span></div>' +
          '<div class="goals">' +
          '<div class="goal ' + (g.dailyGoal===10?'active':'') + '" onclick="setGoal(10)">Oson — 10 XP</div>' +
          '<div class="goal ' + (g.dailyGoal===20?'active':'') + '" onclick="setGoal(20)">Oddiy — 20 XP</div>' +
          '<div class="goal ' + (g.dailyGoal===30?'active':'') + '" onclick="setGoal(30)">Jiddiy — 30 XP</div>' +
          '</div>';
      } else {
        sheet.innerHTML = '<h3>' + icon('gem') + ' ' + (g.gems || 0) + ' olmos</h3>' +
          '<p>Yaxshi natijalar uchun olmos oling.</p>';
      }
      document.getElementById('statModal').classList.add('open');
    }

    function setGoal(n) {
      updateGame(s => { s.dailyGoal = n; });
      openStat('xp');
      refreshStats();
    }

    function renderChips() {
      const box = document.getElementById('chips');
      box.innerHTML = '';
      COURSES_DATA.forEach(c => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'chip' + (c.id === courseId ? ' active' : '');
        el.textContent = c.name;
        el.onclick = () => {
          courseId = c.id;
          localStorage.setItem('bs_current_course', courseId);
          renderAll();
        };
        box.appendChild(el);
      });
    }

    function renderAll() {
      const course = getCourse(courseId);
      if (!course) {
        document.getElementById('units').innerHTML = '<div class="empty"><h3>Fan topilmadi</h3><p>Bosh sahifadan fan tanlang.</p></div>';
        return;
      }
      courseId = course.id;
      localStorage.setItem('bs_current_course', courseId);

      document.getElementById('courseTitle').textContent = course.name;
      document.getElementById('courseDesc').textContent = course.desc || 'Bosqichma-bosqich o‘rganing';

      // overall progress
      let total = 0, done = 0;
      (course.units || []).forEach(u => {
        (u.lessons || []).forEach(l => {
          total++;
          if (isLessonComplete(course.id, l.id)) done++;
        });
      });
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById('courseProg').style.width = pct + '%';
      document.getElementById('coursePct').textContent = pct + '%';

      // CTA
      nextLesson = findNextLesson(course);
      const cta = document.getElementById('continueCta');
      if (nextLesson) {
        cta.classList.add('show');
        const isDone = nextLesson.st === 'done' && done === total;
        cta.innerHTML = (isDone ? 'Qayta o‘rganish' : 'Davom etish') +
          '<small id="continueSub">' + nextLesson.lesson.title + ' · ' + typeLabel(nextLesson.lesson.type || 'lesson') + '</small>';
        cta.onclick = () => openLesson(course.id, nextLesson.lesson.id);
      } else {
        cta.classList.remove('show');
      }

      renderChips();

      const unitsEl = document.getElementById('units');
      unitsEl.innerHTML = '';
      (course.units || []).forEach((unit, ui) => {
        const box = document.createElement('div');
        box.className = 'unit';
        let html = '<div class="unit-label">Bo‘lim ' + (ui + 1) + '</div>';
        html += '<h2>' + (unit.title || ('Bo‘lim ' + (ui + 1))) + '</h2>';
        html += '<p class="udesc">' + (unit.desc || '') + '</p>';
        html += '<div class="path">';

        (unit.lessons || []).forEach((lesson, li) => {
          const st = lessonState(course, unit, lesson, li, ui);
          if (li > 0) {
            html += '<div class="node-line' + (st === 'locked' ? '' : ' done') + '"></div>';
          }
          const iconName = st === 'done' ? 'check' : (st === 'locked' ? 'lock' : (lesson.icon || 'star'));
          html += '<div class="node-wrap"><div class="node-card ' + st + '" data-cid="' + course.id + '" data-lid="' + lesson.id + '" data-st="' + st + '">';
          html += '<div class="node-btn">' + icon(iconName) + '</div>';
          html += '<div class="node-meta">';
          html += '<div class="ntype">' + typeLabel(lesson.type || 'lesson') + '</div>';
          html += '<div class="ntitle">' + (lesson.title || 'Dars') + '</div>';
          html += '<div class="nstatus">' + statusLabel(st) + '</div>';
          html += '</div></div></div>';
        });

        html += '</div>';
        box.innerHTML = html;
        unitsEl.appendChild(box);
      });

      // click handlers
      unitsEl.querySelectorAll('.node-card').forEach(card => {
        card.addEventListener('click', () => {
          const st = card.getAttribute('data-st');
          if (st === 'locked') return;
          openLesson(card.getAttribute('data-cid'), card.getAttribute('data-lid'));
        });
      });
    }

    (async function init() {
      if (window.BilimSariTG && BilimSariTG.autoAuthIfTelegram) {
        await BilimSariTG.autoAuthIfTelegram();
      }
      if (typeof ensureSession === 'function') await ensureSession();

      document.getElementById('icoStreak').innerHTML = icon('flame');
      document.getElementById('icoXp').innerHTML = icon('zap');
      document.getElementById('icoGems').innerHTML = icon('gem');
      document.querySelectorAll('.nav-ico').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
      if (window.BS_I18N) BS_I18N.apply(document);

      await loadCourses();
      courseId = new URLSearchParams(location.search).get('course')
        || localStorage.getItem('bs_current_course')
        || (COURSES_DATA[0] && COURSES_DATA[0].id);

      // onboarding course preference
      try {
        const ob = JSON.parse(localStorage.getItem('bs_onboarding_v1') || '{}');
        if (!new URLSearchParams(location.search).get('course') && ob.courseId) {
          courseId = ob.courseId;
        }
      } catch (e) {}

      refreshStats();
      renderAll();
    })();
  </script>
</body>
</html>
