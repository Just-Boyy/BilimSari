<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>O‘rganish — BilimSari</title>
  <meta name="theme-color" content="#58A700">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f3f4f6; color: #1f2937; min-height: 100vh; padding-bottom: 88px;
    }
    a { text-decoration: none; color: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 40; background: #fff;
      border-bottom: 1px solid #e5e7eb; padding: 10px 14px;
    }
    .topbar-inner {
      max-width: 560px; margin: 0 auto;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .stat {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      font-weight: 800; font-size: 14px; background: #f9fafb;
      border: 1px solid #e5e7eb; border-radius: 12px; padding: 8px 6px; cursor: pointer;
    }
    .stat.streak { color: #f59e0b; }
    .stat.xp { color: #eab308; }
    .stat.gems { color: #0ea5e9; }
    .stat .ico { display:flex; } .stat .ico svg { width:18px;height:18px; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 24px; }
    .course-head {
      background: #fff; border-radius: 18px; padding: 16px;
      border: 1px solid #e5e7eb; margin-bottom: 14px;
    }
    .course-head h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .course-head p { color: #6b7280; font-size: 13px; margin-bottom: 12px; }
    .progress-row { display: flex; align-items: center; gap: 10px; }
    .progress-track { flex: 1; height: 10px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#58A700,#89e219); border-radius: 99px; transition: width .35s; }
    .progress-pct { font-size: 13px; font-weight: 800; color: #58A700; min-width: 40px; text-align: right; }
    .cta {
      width: 100%; margin-bottom: 12px; border: none; border-radius: 16px;
      background: #58A700; color: #fff; font-weight: 800; font-size: 16px;
      padding: 16px 18px; cursor: pointer; box-shadow: 0 4px 0 #3f7d00; text-align: left;
    }
    .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #3f7d00; }
    .cta:disabled { opacity: .6; cursor: wait; }
    .cta small { display: block; font-weight: 600; opacity: .9; font-size: 12px; margin-top: 4px; }
    .cta-secondary {
      width: 100%; margin-bottom: 16px; border: 2px solid #58A700; border-radius: 16px;
      background: #f0fdf4; color: #3f7d00; font-weight: 800; font-size: 15px;
      padding: 14px 16px; cursor: pointer;
    }
    .cta-secondary:disabled { opacity: .6; }
    .unit {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 18px;
      padding: 16px 14px 20px; margin-bottom: 14px;
    }
    .unit-label { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #9ca3af; margin-bottom: 4px; }
    .unit h2 { font-size: 17px; font-weight: 800; margin-bottom: 14px; }
    .path { display: flex; flex-direction: column; align-items: center; }
    .node-line { width: 4px; height: 18px; background: #e5e7eb; border-radius: 4px; }
    .node-line.done { background: #58A700; }
    .node-card {
      width: 100%; max-width: 300px; display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 16px; border: 2px solid #e5e7eb; background: #fafafa;
    }
    .node-card.current { border-color: #58A700; background: #f0fdf4; box-shadow: 0 0 0 4px rgba(88,167,0,.12); cursor: pointer; }
    .node-card.done { border-color: #bbf7d0; background: #fff; cursor: pointer; }
    .node-card.locked { opacity: .55; }
    .node-btn {
      width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; border: 3px solid #d1d5db; background: #fff; color: #9ca3af;
    }
    .node-card.current .node-btn { border-color: #58A700; background: #58A700; color: #fff; }
    .node-card.done .node-btn { border-color: #58A700; background: #dcfce7; color: #58A700; }
    .node-btn svg { width: 22px; height: 22px; }
    .node-meta .ntype { font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; }
    .node-card.current .node-meta .ntype { color: #58A700; }
    .node-meta .ntitle { font-size: 15px; font-weight: 800; color: #111827; }
    .node-meta .nstatus { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .empty { text-align: center; padding: 32px 16px; color: #6b7280; }
    .err { color: #b91c1c; font-size: 13px; margin: 8px 0; }
    .bnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: #fff; border-top: 1px solid #e5e7eb;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .bnav-inner { max-width: 560px; margin: 0 auto; display: flex; justify-content: space-around; }
    .bnav a {
      flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: #9ca3af;
      padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .bnav a.active { color: #58A700; }
    .nav-ico { display: flex; height: 24px; align-items: center; justify-content: center; }
    .nav-ico svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <button type="button" class="stat streak" id="bStreak"><span class="ico" id="icoStreak"></span><span id="sStreak">0</span></button>
      <button type="button" class="stat xp" id="bXp"><span class="ico" id="icoXp"></span><span id="sXp">0</span></button>
      <button type="button" class="stat gems" id="bGems"><span class="ico" id="icoGems"></span><span id="sGems">0</span></button>
    </div>
  </div>

  <div class="wrap">
    <div class="course-head">
      <h1 id="courseTitle">Yuklanmoqda...</h1>
      <p id="courseDesc">Faqat siz tanlagan fan bo‘yicha o‘qilasiz. Yangi mavzular AI tomonidan yaratiladi va saqlanadi.</p>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="courseProg"></div></div>
        <div class="progress-pct" id="coursePct">0%</div>
      </div>
    </div>

    <button type="button" class="cta" id="continueCta">Davom etish<small id="continueSub">Keyingi dars</small></button>
    <button type="button" class="cta-secondary" id="genNextBtn">Yangi mavzu yaratish (AI)</button>
    <p class="err" id="errBox" style="display:none"></p>
    <div id="units"></div>
  </div>

  <nav class="bnav"><div class="bnav-inner">
    <a href="learn.html" class="active"><span class="nav-ico" data-icon="home"></span>O‘rganish</a>
    <a href="profile.html"><span class="nav-ico" data-icon="user"></span>Profil</a>
  </div></nav>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/js/telegram.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/ai.js"></script>
  <script>
    let courseId = null;
    let lessons = [];
    let courseName = '';

    function getOnboardingCourse() {
      try {
        const ob = JSON.parse(localStorage.getItem('bs_onboarding_v1') || '{}');
        if (ob.courseId) return ob.courseId;
      } catch (e) {}
      return localStorage.getItem('bs_current_course') || null;
    }

    function lessonState(seq) {
      const id = courseId + '-ai-' + seq;
      const done = isLessonDone(courseId, id) || isLessonDone(courseId, String(seq));
      if (done) return 'done';
      // first incomplete is current
      for (let i = 0; i < lessons.length; i++) {
        const L = lessons[i];
        const lid = courseId + '-ai-' + L.seq;
        const d = isLessonDone(courseId, lid) || isLessonDone(courseId, String(L.seq));
        if (!d) {
          return L.seq === seq ? 'current' : (L.seq < seq ? 'current' : 'locked');
        }
      }
      return 'done';
    }

    function resolveStates() {
      let foundCurrent = false;
      return lessons.map((L) => {
        const id = courseId + '-ai-' + L.seq;
        const done = isLessonDone(courseId, id) || isLessonDone(courseId, String(L.seq));
        if (done) return { ...L, st: 'done', lid: id };
        if (!foundCurrent) {
          foundCurrent = true;
          return { ...L, st: 'current', lid: id };
        }
        return { ...L, st: 'locked', lid: id };
      });
    }

    function openLesson(seq) {
      location.href = 'lesson.html?course=' + encodeURIComponent(courseId) + '&seq=' + encodeURIComponent(seq);
    }

    function refreshStats() {
      const g = getGame();
      document.getElementById('sStreak').textContent = g.streak || 0;
      document.getElementById('sXp').textContent = g.xp || 0;
      document.getElementById('sGems').textContent = g.gems || 0;
    }

    async function loadPath() {
      const res = await fetch('/api/path/' + encodeURIComponent(courseId));
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Path yuklanmadi');
      lessons = data.lessons || [];
      courseName = data.course_name || courseId;
      document.getElementById('courseTitle').textContent = courseName;
      if (data.error_gen) {
        document.getElementById('errBox').style.display = 'block';
        document.getElementById('errBox').textContent = data.error_gen;
      } else {
        document.getElementById('errBox').style.display = 'none';
      }
      render();
    }

    function render() {
      const states = resolveStates();
      const doneN = states.filter(s => s.st === 'done').length;
      const total = Math.max(states.length, 1);
      const pct = Math.round((doneN / total) * 100);
      document.getElementById('courseProg').style.width = pct + '%';
      document.getElementById('coursePct').textContent = pct + '%';

      const cur = states.find(s => s.st === 'current') || states[states.length - 1];
      const cta = document.getElementById('continueCta');
      if (cur) {
        cta.innerHTML = (cur.st === 'done' ? 'Qayta o‘rganish' : 'Davom etish') +
          '<small id="continueSub">' + cur.title + ' · Dars ' + cur.seq + '</small>';
        cta.onclick = () => openLesson(cur.seq);
      }

      // group by unit_title
      const groups = {};
      states.forEach(s => {
        const u = s.unit_title || 'Asosiy bo‘lim';
        if (!groups[u]) groups[u] = [];
        groups[u].push(s);
      });

      const unitsEl = document.getElementById('units');
      unitsEl.innerHTML = '';
      if (!states.length) {
        unitsEl.innerHTML = '<div class="empty"><h3>Hali dars yo‘q</h3><p>«Yangi mavzu yaratish» ni bosing.</p></div>';
        return;
      }
      Object.keys(groups).forEach((unitName, ui) => {
        const box = document.createElement('div');
        box.className = 'unit';
        let html = '<div class="unit-label">Bo‘lim</div><h2>' + unitName + '</h2><div class="path">';
        groups[unitName].forEach((L, i) => {
          if (i > 0) html += '<div class="node-line' + (L.st !== 'locked' ? ' done' : '') + '"></div>';
          const iconName = L.st === 'done' ? 'check' : (L.st === 'locked' ? 'lock' : 'star');
          const status = L.st === 'current' ? 'Hozirgi dars — bosing' : (L.st === 'done' ? 'Tugallangan' : 'Avvalgisini tugating');
          html += '<div class="node-card ' + L.st + '" data-seq="' + L.seq + '" data-st="' + L.st + '">' +
            '<div class="node-btn">' + icon(iconName) + '</div>' +
            '<div class="node-meta"><div class="ntype">Dars ' + L.seq + '</div>' +
            '<div class="ntitle">' + L.title + '</div>' +
            '<div class="nstatus">' + status + '</div></div></div>';
        });
        html += '</div>';
        box.innerHTML = html;
        unitsEl.appendChild(box);
      });

      unitsEl.querySelectorAll('.node-card').forEach(card => {
        card.addEventListener('click', () => {
          if (card.getAttribute('data-st') === 'locked') return;
          openLesson(card.getAttribute('data-seq'));
        });
      });
    }

    async function generateNext() {
      const btn = document.getElementById('genNextBtn');
      btn.disabled = true;
      btn.textContent = 'Yaratilmoqda...';
      document.getElementById('errBox').style.display = 'none';
      try {
        const res = await fetch('/api/lessons/next', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ course_id: courseId })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Xato');
        await loadPath();
      } catch (e) {
        document.getElementById('errBox').style.display = 'block';
        document.getElementById('errBox').textContent = e.message || String(e);
      }
      btn.disabled = false;
      btn.textContent = 'Yangi mavzu yaratish (AI)';
    }

    (async function init() {
      if (window.BilimSariTG && BilimSariTG.autoAuthIfTelegram) await BilimSariTG.autoAuthIfTelegram();
      if (typeof ensureSession === 'function') await ensureSession();

      courseId = getOnboardingCourse();
      if (!courseId) {
        location.href = 'index.html';
        return;
      }
      localStorage.setItem('bs_current_course', courseId);

      document.getElementById('icoStreak').innerHTML = icon('flame');
      document.getElementById('icoXp').innerHTML = icon('zap');
      document.getElementById('icoGems').innerHTML = icon('gem');
      document.querySelectorAll('.nav-ico').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
      document.getElementById('genNextBtn').onclick = generateNext;
      refreshStats();
      try {
        await loadPath();
      } catch (e) {
        document.getElementById('courseTitle').textContent = 'Xato';
        document.getElementById('errBox').style.display = 'block';
        document.getElementById('errBox').textContent = e.message || String(e);
      }
    })();
  </script>
</body>
</html>
