<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dars — BilimSari</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BilimSari">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/apple-touch-icon-120.png">
  <meta name="theme-color" content="#58A700">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #fff;
      color: #3c3c3c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 2px solid #e5e5e5;
    }
    .exit {
      width: 40px; height: 40px;
      border: none;
      border-radius: 12px;
      background: #58A700;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 0 #3f7d00;
    }
    .exit:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3f7d00;
    }
    .prog-wrap {
      flex: 1;
      height: 14px;
      background: #e5e5e5;
      border-radius: 99px;
      overflow: hidden;
    }
    .prog-bar {
      height: 100%;
      width: 0%;
      background: #58A700;
      border-radius: 99px;
      transition: width .35s ease, background .25s ease;
    }
    .prog-bar.is-correct { background: #58A700; }
    .prog-bar.is-wrong { background: #FF4B4B; }
    .hearts { display:flex; gap:2px; align-items:center; } .hearts svg { width:18px; height:18px; } .emoji svg { width:64px; height:64px; color:#58A700; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px 120px;
    }
    .q-type {
      font-size: 13px; font-weight: 700; color: #afafaf;
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px;
    }
    .q-text {
      font-size: 24px; font-weight: 700; line-height: 1.3; margin-bottom: 28px;
    }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .opt {
      text-align: left;
      padding: 16px 18px;
      border: 2px solid #e5e5e5;
      border-radius: 14px;
      background: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
      color: #3c3c3c;
      position: relative;
      z-index: 2;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .opt:hover:not(:disabled) { background: #f7f7f7; }
    .opt:active:not(:disabled) { transform: scale(0.98); }
    .opt.selected { border-color: #1CB0F6; background: #ddf4ff; }
    .opt.correct { border-color: #58A700; background: #d7ffb8; color: #3c3c3c; }
    .opt.wrong { border-color: #FF4B4B; background: #ffdfe0; }
    .opt:disabled { cursor: default; }

    .tf-row { display: flex; gap: 12px; }
    .tf-row .opt { flex: 1; text-align: center; font-size: 18px; padding: 20px; }

    .fill-input {
      width: 100%;
      padding: 16px 18px;
      border: 2px solid #e5e5e5;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      outline: none;
    }
    .fill-input:focus { border-color: #1CB0F6; }
    .fill-input.correct { border-color: #58A700; background: #d7ffb8; }
    .fill-input.wrong { border-color: #FF4B4B; background: #ffdfe0; }

    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .match-item {
      padding: 14px;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      transition: .15s;
    }
    .match-item.picked { border-color: #1CB0F6; background: #ddf4ff; }
    .match-item.done { opacity: .4; pointer-events: none; }
    .match-item.correct { border-color: #58A700; background: #d7ffb8; }

    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 2px solid #e5e5e5;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    }
    .footer-inner { max-width: 600px; margin: 0 auto; }
    .check-btn, .continue-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: .3px;
      transition: .15s;
    }
    .check-btn {
      background: #e5e5e5;
      color: #afafaf;
    }
    .check-btn.active {
      background: #58A700;
      color: #fff;
      box-shadow: 0 4px 0 #3f7d00;
    }
    .check-btn.active:active { transform: translateY(2px); box-shadow: 0 2px 0 #3f7d00; }
    .continue-btn {
      background: #58A700;
      color: #fff;
      box-shadow: 0 4px 0 #3f7d00;
    }
    .continue-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #3f7d00; }
    .continue-btn.wrong-theme {
      background: #FF4B4B;
      box-shadow: 0 4px 0 #c73434;
    }

    .feedback {
      display: none;
      padding: 12px 0 8px;
    }
    .feedback.show { display: block; }
    .feedback h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .feedback.ok h3 { color: #58A700; }
    .feedback.bad h3 { color: #FF4B4B; }
    .feedback p { font-size: 15px; color: #777; font-weight: 600; }

    /* Complete screen */
    .complete {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      min-height: 100vh;
      background: linear-gradient(180deg, #d7ffb8 0%, #fff 45%);
    }
    .complete.show { display: flex; }
    .complete .emoji { font-size: 72px; margin-bottom: 12px; }
    .complete h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .complete .stats {
      display: flex; gap: 20px; margin: 24px 0 32px; flex-wrap: wrap; justify-content: center;
    }
    .complete .stat {
      background: #fff;
      border: 2px solid #e5e5e5;
      border-radius: 16px;
      padding: 16px 22px;
      min-width: 100px;
    }
    .complete .stat b { display: block; font-size: 22px; color: #58A700; }
    .complete .stat span { font-size: 12px; color: #afafaf; font-weight: 700; text-transform: uppercase; }
    .complete .btn {
      width: 100%; max-width: 320px; height: 52px;
      background: #58A700; color: #fff; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 0 #3f7d00;
    }

    /* Hearts empty modal */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 100; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #fff; border-radius: 20px; padding: 28px 24px; max-width: 360px; width: 100%;
      text-align: center;
    }
    .modal h2 { font-size: 22px; margin-bottom: 8px; }
    .modal p { color: #777; margin-bottom: 20px; font-size: 15px; }
    .modal button {
      width: 100%; height: 48px; border: none; border-radius: 12px;
      font-weight: 800; font-size: 15px; cursor: pointer; margin-bottom: 10px;
    }
    .modal .primary { background: #58A700; color: #fff; }
    .modal .secondary { background: #e5e5e5; color: #555; }

    @keyframes confettiFall {
      0% { transform: translateY(-10vh) rotate(0); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .confetti {
      position: fixed; width: 10px; height: 14px; top: -20px; z-index: 50;
      animation: confettiFall 2.5s linear forwards;
    }
  </style>
</head>
<body>
  <div id="lessonUI">
    <div class="top">
      <button type="button" class="exit" id="exitBtn" aria-label="Chiqish">×</button>
      <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
      <div class="hearts" id="heartsEl">❤️❤️❤️❤️❤️</div>
    </div>
    <div class="main" id="main"></div>
    <div class="footer">
      <div class="footer-inner">
        <div class="feedback" id="feedback">
          <h3 id="fbTitle"></h3>
          <p id="fbText"></p>
        </div>
        <button type="button" class="check-btn" id="actionBtn">TEKSHIRISH</button>
      </div>
    </div>
  </div>

  <div class="complete" id="completeUI">
    <div class="emoji" id="completeIcon"></div>
    <h1>Dars tugadi!</h1>
    <div class="stats">
      <div class="stat"><b id="cXp">+0</b><span>XP</span></div>
      <div class="stat"><b id="cAcc">0%</b><span>Aniqlik</span></div>
      <div class="stat"><b id="cStreak">0</b><span>Streak</span></div>
    </div>
    <button type="button" class="btn" id="completeContinue">DAVOM ETISH</button>
  </div>

  <div class="modal-bg" id="heartsModal">
    <div class="modal">
      <div id="heartModalIcon" style="margin-bottom:8px;color:#ff4b4b;display:flex;justify-content:center;"></div>
      <h2>Yuraklaringiz tugadi</h2>
      <p>Takrorlash orqali yurak tiklash mumkin yoki keyinroq qayting.</p>
      <button type="button" class="primary" id="practiceHeartsBtn">Takrorlash (+1 ❤️)</button>
      <button type="button" class="secondary" id="heartsExitBtn">Chiqish</button>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/data.js"></script>
  <script>
    (async function () {
      await ensureSession();

    const params = new URLSearchParams(location.search);
    const courseId = params.get('course');
    const lessonId = params.get('lesson');
    const found = findLesson(courseId, lessonId);
    if (!found) { location.href = 'learn.html'; }

    const questions = getQuestions(lessonId);
    let idx = 0;
    let correctCount = 0;
    let selected = null;
    let checked = false;
    let matchPicked = null;
    let matchPairsDone = 0;
    let xpEarned = 0;

    function renderHearts() {
      const h = getGame().hearts;
      const he = document.getElementById('heartsEl');
      he.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const s = document.createElement('span');
        s.style.cssText = 'display:inline-flex;color:' + (i < h ? '#ff4b4b' : '#ddd');
        s.innerHTML = icon(i < h ? 'heart' : 'heartEmpty');
        he.appendChild(s);
      }
    }

    function updateProg() {
      const pct = (idx / questions.length) * 100;
      const bar = document.getElementById('progBar');
      if (bar) {
        bar.style.width = pct + '%';
        // yangi savolda default yashil (javobdan keyin rang o‘zgaradi)
        if (!checked) {
          bar.classList.remove('is-wrong');
          bar.classList.add('is-correct');
        }
      }
    }

    function typeLabel(t) {
      return { mc: 'Tanlang', tf: 'To‘g‘ri / Noto‘g‘ri', fill: 'Bo‘sh joyni to‘ldiring', match: 'Moslashtiring', type: 'Yozing' }[t] || 'Savol';
    }

    function renderQuestion() {
      checked = false;
      selected = null;
      matchPicked = null;
      matchPairsDone = 0;
      updateProg();
      renderHearts();

      const q = questions[idx];
      const main = document.getElementById('main');
      const fb = document.getElementById('feedback');
      fb.className = 'feedback';
      const btn = document.getElementById('actionBtn');
      btn.className = 'check-btn';
      btn.textContent = 'TEKSHIRISH';
      btn.onclick = onAction;

      let html = `<div class="q-type">${typeLabel(q.type)}</div><div class="q-text">${q.q || 'Mos juftlarni toping'}</div>`;

      if (q.type === 'mc') {
        html += '<div class="options">';
        q.options.forEach((o, i) => {
          html += `<button type="button" class="opt" data-i="${i}">${o}</button>`;
        });
        html += '</div>';
      } else if (q.type === 'tf') {
        html += `<div class="tf-row">
          <button type="button" class="opt" data-v="true">TO‘G‘RI</button>
          <button type="button" class="opt" data-v="false">NOTO‘G‘RI</button>
        </div>`;
      } else if (q.type === 'fill' || q.type === 'type') {
        html += `<input class="fill-input" id="fillInput" placeholder="Javobni yozing..." autocomplete="off">`;
      } else if (q.type === 'match') {
        const left = q.pairs.map((p, i) => ({ t: p[0], i, side: 'L' }));
        const right = q.pairs.map((p, i) => ({ t: p[1], i, side: 'R' })).sort(() => Math.random() - 0.5);
        html += '<div class="match-grid" id="matchGrid">';
        left.forEach(x => { html += `<div class="match-item" data-side="L" data-i="${x.i}">${x.t}</div>`; });
        right.forEach(x => { html += `<div class="match-item" data-side="R" data-i="${x.i}">${x.t}</div>`; });
        html += '</div>';
      }

      main.innerHTML = html;
      const fill = document.getElementById('fillInput');
      if (fill) fill.addEventListener('input', onFillInput);
      if (q.type === 'match') {
        // auto-complete when all matched — check handled in pickMatch
        btn.style.display = 'none';
      } else {
        btn.style.display = 'block';
      }
    }

    function selectMc(i) {
      if (checked) return;
      selected = i;
      document.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
      document.querySelector(`.opt[data-i="${i}"]`).classList.add('selected');
      document.getElementById('actionBtn').classList.add('active');
    }

    function selectTf(v) {
      if (checked) return;
      selected = v;
      document.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
      document.querySelector(`.opt[data-v="${v}"]`).classList.add('selected');
      document.getElementById('actionBtn').classList.add('active');
    }

    function onFillInput() {
      const v = document.getElementById('fillInput').value.trim();
      document.getElementById('actionBtn').classList.toggle('active', v.length > 0);
    }

    function pickMatch(el) {
      if (checked || el.classList.contains('done')) return;
      if (!matchPicked) {
        document.querySelectorAll('.match-item.picked').forEach(e => e.classList.remove('picked'));
        el.classList.add('picked');
        matchPicked = el;
        return;
      }
      if (matchPicked === el) {
        el.classList.remove('picked');
        matchPicked = null;
        return;
      }
      if (matchPicked.dataset.side === el.dataset.side) {
        matchPicked.classList.remove('picked');
        el.classList.add('picked');
        matchPicked = el;
        return;
      }
      // different sides
      if (matchPicked.dataset.i === el.dataset.i) {
        matchPicked.classList.add('correct', 'done');
        el.classList.add('correct', 'done');
        matchPicked.classList.remove('picked');
        matchPicked = null;
        matchPairsDone++;
        const q = questions[idx];
        if (matchPairsDone >= q.pairs.length) {
          // success
          finishCheck(true, null);
        }
      } else {
        el.classList.add('wrong');
        matchPicked.classList.add('wrong');
        const a = matchPicked, b = el;
        setTimeout(() => {
          a.classList.remove('picked', 'wrong');
          b.classList.remove('wrong');
        }, 400);
        matchPicked = null;
        // wrong costs heart on match? mild - only on full fail; skip for UX
      }
    }

    function onAction() {
      if (checked) {
        nextQ();
        return;
      }
      const q = questions[idx];
      let ok = false;
      let correctText = '';

      if (q.type === 'mc') {
        if (selected === null) return;
        ok = selected === q.answer;
        correctText = q.options[q.answer];
        document.querySelectorAll('.opt').forEach(el => {
          el.disabled = true;
          const i = +el.dataset.i;
          if (i === q.answer) el.classList.add('correct');
          else if (i === selected && !ok) el.classList.add('wrong');
        });
      } else if (q.type === 'tf') {
        if (selected === null) return;
        ok = selected === q.answer;
        correctText = q.answer ? 'TO‘G‘RI' : 'NOTO‘G‘RI';
        document.querySelectorAll('.opt').forEach(el => {
          el.disabled = true;
          const v = el.dataset.v === 'true';
          if (v === q.answer) el.classList.add('correct');
          else if (v === selected && !ok) el.classList.add('wrong');
        });
      } else if (q.type === 'fill' || q.type === 'type') {
        const input = document.getElementById('fillInput');
        const val = (input.value || '').trim().toLowerCase();
        if (!val) return;
        const ans = String(q.answer).toLowerCase().trim();
        ok = val === ans || val === ans.replace(/ʻ/g, "'");
        correctText = q.answer;
        input.disabled = true;
        input.classList.add(ok ? 'correct' : 'wrong');
      }

      finishCheck(ok, correctText);
    }

    function finishCheck(ok, correctText) {
      checked = true;
      const bar = document.getElementById('progBar');
      if (bar) {
        bar.classList.remove('is-correct', 'is-wrong');
        bar.classList.add(ok ? 'is-correct' : 'is-wrong');
      }
      const q = questions[idx];
      const fb = document.getElementById('feedback');
      const btn = document.getElementById('actionBtn');
      btn.style.display = 'block';

      if (ok) {
        correctCount++;
        const gain = 10;
        xpEarned += gain;
        addXp(gain);
        showFloatingXp(gain, document.getElementById('actionBtn'));
        fb.className = 'feedback show ok';
        document.getElementById('fbTitle').textContent = 'To‘g‘ri!';
        document.getElementById('fbText').textContent = `+${gain} XP`;
        var expOk = document.getElementById('aiExplainBtn'); if (expOk) expOk.style.display = 'none';
        btn.className = 'continue-btn';
        btn.textContent = 'DAVOM ETISH';
      } else {
        loseHeart();
        renderHearts();
        pushWrong({ id: q.id, courseId, lessonId, q: q.q || 'Moslashtirish', answer: correctText });
        fb.className = 'feedback show bad';
        document.getElementById('fbTitle').textContent = 'Noto‘g‘ri';
        document.getElementById('fbText').textContent = correctText ? ('To‘g‘ri javob: ' + correctText) : 'Qayta urinib ko‘ring';
        var exp = document.getElementById('aiExplainBtn');
        if (!exp) {
          exp = document.createElement('button');
          exp.id = 'aiExplainBtn';
          exp.type = 'button';
          exp.textContent = 'AI tushuntirsin';
          exp.style.cssText = 'margin-top:10px;width:100%;height:40px;border:none;border-radius:10px;background:#1CB0F6;color:#fff;font-weight:700;cursor:pointer';
          document.getElementById('feedback').appendChild(exp);
        }
        exp.style.display = 'block';
        exp.onclick = function () { explainCurrentWrong(correctText); };
        btn.className = 'continue-btn wrong-theme';
        btn.textContent = 'DAVOM ETISH';
        document.getElementById('main').classList.add('bs-shake');
        setTimeout(() => document.getElementById('main').classList.remove('bs-shake'), 400);

        if (getGame().hearts <= 0) {
          setTimeout(() => document.getElementById('heartsModal').classList.add('open'), 500);
        }
      }
    }

    function nextQ() {
      idx++;
      if (idx >= questions.length) {
        finishLesson();
      } else {
        renderQuestion();
      }
    }

    
    async function explainCurrentWrong(correctText) {
      const q = questions[idx];
      const subject = (found && found.course && found.course.name) || '';
      const questionText = q.q || q.question || '';
      const userAns = selected != null ? (q.options ? q.options[selected] : String(selected)) : '';
      const btn = document.getElementById('aiExplainBtn');
      if (btn) { btn.disabled = true; btn.textContent = '...'; }
      try {
        const data = await BilimSariAI.explainWrong(questionText, correctText || '', userAns, subject);
        const fb = document.getElementById('fbText');
        if (data && data.ok && data.reply) {
          if (fb) fb.textContent = data.reply;
        } else if (fb) {
          fb.textContent = (data && data.error) || 'AI tushuntira olmadi';
        }
      } catch (e) {
        const fb = document.getElementById('fbText');
        if (fb) fb.textContent = 'AI xatosi';
      }
      if (btn) { btn.disabled = false; btn.textContent = 'AI tushuntirsin'; }
    }

    function finishLesson() {
      const acc = Math.round((correctCount / questions.length) * 100);
      // bonus XP
      let bonus = 20;
      if (acc === 100) bonus += 15;
      else if (acc >= 80) bonus += 5;
      xpEarned += bonus;
      addXp(bonus);
      markLessonComplete(courseId, lessonId, acc);
      if (acc >= 80) addGems(5);

      document.getElementById('lessonUI').style.display = 'none';
      document.getElementById('completeUI').classList.add('show');
      document.getElementById('completeIcon').innerHTML = icon('trophy');
      document.getElementById('cXp').textContent = '+' + xpEarned;
      document.getElementById('cAcc').textContent = acc + '%';
      document.getElementById('cStreak').textContent = getGame().streak;
      launchConfetti();
    }

    function launchConfetti() {
      const colors = ['#58A700', '#1CB0F6', '#FF4B4B', '#FFC800', '#CE82FF'];
      for (let i = 0; i < 40; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[i % colors.length];
        el.style.animationDelay = (Math.random() * 0.8) + 's';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }
    }

    document.getElementById('main').addEventListener('click', function (e) {
      const opt = e.target.closest('.opt');
      if (opt) {
        e.preventDefault();
        if (opt.dataset.i !== undefined) {
          selectMc(+opt.dataset.i);
        } else if (opt.dataset.v !== undefined) {
          selectTf(opt.dataset.v === 'true');
        }
        return;
      }
      const match = e.target.closest('.match-item');
      if (match) pickMatch(match);
    });

    const actionBtnEl = document.getElementById('actionBtn');
    if (actionBtnEl) actionBtnEl.addEventListener('click', onAction);

    const exitBtnEl = document.getElementById('exitBtn');
    if (exitBtnEl) exitBtnEl.addEventListener('click', function (e) {
      e.preventDefault();
      confirmExit();
    });

    const completeContinue = document.getElementById('completeContinue');
    if (completeContinue) completeContinue.addEventListener('click', goBack);

    const practiceHeartsBtn = document.getElementById('practiceHeartsBtn');
    if (practiceHeartsBtn) practiceHeartsBtn.addEventListener('click', practiceForHearts);
    const heartsExitBtn = document.getElementById('heartsExitBtn');
    if (heartsExitBtn) heartsExitBtn.addEventListener('click', goBack);

    function confirmExit() {
      goBack();
    }

    function goBack() {
      const c = courseId || localStorage.getItem('bs_current_course') || '';
      location.href = 'learn.html?course=' + encodeURIComponent(c);
    }

    function practiceForHearts() {
      restoreHeart(1);
      document.getElementById('heartsModal').classList.remove('open');
      renderHearts();
    }

    window.selectMc = selectMc;
    window.selectTf = selectTf;
    window.onAction = onAction;
    window.goBack = goBack;
    window.pickMatch = pickMatch;
    window.onFillInput = onFillInput;
    window.confirmExit = confirmExit;
    window.practiceForHearts = practiceForHearts;

    if (getGame().hearts <= 0) {
      document.getElementById('heartsModal').classList.add('open');
      const hm = document.getElementById('heartModalIcon');
      if (hm) hm.innerHTML = icon('heartEmpty');
    }
    renderQuestion();
    })();
  </script>
<script>if(window.BS_I18N)BS_I18N.apply(document);</script>
</body>
</html>
