<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Reyting — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="ustki">
  <a class="orqaga" href="dashboard.html" aria-label="Orqaga">←</a>
  <h1>Reyting</h1>
</div>

<main class="sahifa" style="padding-top:18px">
  <p class="izoh" style="margin-bottom:14px">Chaqmoq bo'yicha eng faol o'quvchilar</p>
  <div id="royxat">
    <div class="skelet" style="height:56px;margin-bottom:8px"></div>
    <div class="skelet" style="height:56px;margin-bottom:8px"></div>
    <div class="skelet" style="height:56px"></div>
  </div>
  <div id="menUchun"></div>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  if (!(await UI.sessiyaKerak())) return;
  UI.navChiz('leaderboard.html');

  var MEDAL_RANG = { 1: 'medal-1', 2: 'medal-2', 3: 'medal-3' };

  function qatorHtml(u) {
    var o_rin = u.rank <= 3
      ? '<span class="o-rin ' + (MEDAL_RANG[u.rank] || '') + '">' + UI.nishon('medal') + '</span>'
      : '<span class="o-rin">' + u.rank + '</span>';
    var avatar = u.photo_url
      ? '<img class="avatar" alt="" src="' + UI.esc(u.photo_url) + '">'
      : '<div class="avatar">' + UI.harfAvatar(u.name) + '</div>';
    return '<div class="reyting-qator' + (u.me ? ' men' : '') + '">' +
      o_rin + avatar +
      '<span class="ism">' + UI.esc(u.name) + (u.me ? ' (siz)' : '') + '</span>' +
      '<span class="chaqmoq-belgi">' + UI.nishon('chaqmoq', 'nishon') + '<span class="son">' + u.chaqmoq + '</span></span>' +
      '</div>';
  }

  async function yukla() {
    var royxat = document.getElementById('royxat');
    var menUchun = document.getElementById('menUchun');
    var res = await API.reyting();

    if (!res.ok) { royxat.innerHTML = UI.xatoHolat(res.error, yukla); return; }

    if (!res.top.length) {
      royxat.innerHTML = UI.holat({
        belgi: 'trophy',
        sarlavha: 'Reyting hali bo\'sh',
        matn: 'Birinchi mavzuni tugatgan o\'quvchi reytingda birinchi bo\'ladi!',
      });
      return;
    }

    royxat.innerHTML = res.top.map(qatorHtml).join('');

    // Agar foydalanuvchi top ro'yxatda bo'lmasa, alohida ko'rsatamiz
    if (res.me && !res.top.some(function (u) { return u.me; })) {
      menUchun.innerHTML = '<div class="mening-o-rnim">' + qatorHtml(res.me) + '</div>';
    } else {
      menUchun.innerHTML = '';
    }
  }

  yukla();
})();
</script>
</body>
</html>
