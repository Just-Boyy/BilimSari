<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Fan sotib olish — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/i18n.js"></script>
</head>
<body>

<div class="ustki">
  <a class="orqaga" href="dashboard.html" aria-label="Orqaga">←</a>
  <h1>Fan sotib olish<small>Telegram Stars yoki karta orqali</small></h1>
</div>

<main class="sahifa" style="padding-top:18px">
  <div id="tana">
    <div class="skelet" style="height:220px"></div>
  </div>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  if (!(await UI.sessiyaKerak())) return;
  UI.navChiz('shop.html');

  var tana = document.getElementById('tana');
  var dokon = null;
  var tanlangan = [];
  var promo = '';
  var hisobTimer = null;
  var oxirgiHisob = 0;
  var oxirgiNarx = null;   // oxirgi hisoblangan narx (qayta chizish uchun)
  var usul = null;         // tanlangan to'lov usuli: 'card' | 'stars'

  var som = UI.pul;

  async function yukla() {
    var d = await API.do_kon();
    if (!d.ok) { tana.innerHTML = UI.xatoHolat(d.error, yukla); return; }
    dokon = d;
    var boshi = new URLSearchParams(location.search).get('fan');
    tanlangan = d.subjects.some(function (s) { return s.key === boshi; }) ? [boshi] : [];
    chiz();
  }

  function buyurtmaHtml(o) {
    var nomlar = o.items.map(function (i) { return i.name; }).join(', ');
    if (o.status === 'pending') {
      return '<div class="karta dokon-buyurtma kutilmoqda" style="margin-bottom:16px">' +
        '<h2>Chekingiz tekshirilmoqda ⏳</h2>' +
        '<p>Buyurtma ' + UI.esc(o.code) + ' • ' + UI.esc(nomlar) + ' • ' + som(o.amount) + '.<br>' +
          'Odatda 5–30 daqiqa. Tasdiqlangach fan ochiladi va botga xabar keladi.</p>' +
        '<div class="dokon-tugmalar"><button class="tugma tugma-mayda" type="button" data-bot>' +
          UI.nishon('send') + '<span>Botni ochish</span></button></div></div>';
    }
    return '<div class="karta dokon-buyurtma" style="margin-bottom:16px">' +
      '<h2>Buyurtma ' + UI.esc(o.code) + ' — chek kutilmoqda</h2>' +
      '<p>' + UI.esc(nomlar) + ' • <b>' + som(o.amount) + '</b>.<br>' +
        'Karta raqami botga yuborilgan. To\'lab, chek rasmini botga yuboring.</p>' +
      '<div class="dokon-tugmalar">' +
        '<button class="tugma tugma-mayda" type="button" data-bot>' + UI.nishon('send') + '<span>Botni ochish</span></button>' +
        '<button class="matn-tugma xavfli" type="button" id="bekorTugma">Bekor qilish</button>' +
      '</div></div>';
  }

  function chiz() {
    var d = dokon;
    if (!d.telegram) {
      tana.innerHTML = UI.holat({
        belgi: 'send', sarlavha: "To'lov Telegram orqali",
        matn: "Fan sotib olish uchun BilimSari'ni Telegram botdan oching — to'lov bot chatida amalga oshiriladi.",
      }) + '<button class="tugma" type="button" style="margin-top:12px" data-bot>Botni ochish</button>';
      bogla();
      return;
    }
    var faol = d.active_order;
    var tepa = faol ? buyurtmaHtml(faol) : '';
    if (faol && faol.status === 'pending') {
      tana.innerHTML = tepa;
      bogla();
      return;
    }
    if (!d.subjects.length) {
      tana.innerHTML = tepa + UI.holat({
        belgi: 'party', sarlavha: 'Barcha fanlar ochiq!',
        matn: "Sizda sotib olinadigan fan qolmadi. O'qishda omad!",
        tugma: 'Fanlarim', tugmaYo_l: 'subjects.html',
      });
      bogla();
      return;
    }
    if (!d.configured && !(d.stars_enabled && starsMumkin())) {
      tana.innerHTML = tepa + (d.is_admin
        ? UI.holat({
            belgi: 'settings', sarlavha: 'Karta raqami kiritilmagan',
            matn: "Siz adminsiz. O'quvchilar to'lov qila olishi uchun karta raqamini kiriting — u botda o'quvchiga ko'rsatiladi.",
            tugma: 'Kartani kiritish', tugmaYo_l: 'admin.html#tolovlar',
          })
        : UI.holat({
            belgi: 'clock', sarlavha: "To'lov vaqtincha ishlamayapti",
            matn: "Birozdan keyin qayta urinib ko'ring yoki savolingizni botga yozing.",
          }));
      bogla();
      return;
    }
    var p = d.prices;
    var paketlar = [];
    if (p.price_three && d.subjects.length >= 3) paketlar.push('3 ta fan — ' + som(p.price_three));
    if (p.price_all && d.subjects.length >= 2) paketlar.push('Barcha fanlar (' + d.subjects.length + ' ta) — ' + som(p.price_all));

    var starsBor = d.stars_enabled && starsMumkin();
    var qadamlar = starsBor && d.configured
      ? ['Fan tanlang', 'To\'lov usulini tanlang', 'Stars — fan darhol ochiladi', 'Karta — admin chekni tasdiqlaydi']
      : starsBor
        ? ['Fan tanlang', 'Telegram Stars bilan to\'lang', 'Fan darhol ochiladi']
        : ['Fan tanlang', 'Botga karta raqami keladi', 'To\'lab, chekni botga yuboring', 'Admin tasdiqlaydi'];
    tana.innerHTML = tepa +
      '<ol class="dokon-qadamlar" aria-label="Qanday ishlaydi" style="grid-template-columns:repeat(' + qadamlar.length + ',1fr)">' +
        qadamlar.map(function (q) { return '<li>' + UI.esc(q) + '</li>'; }).join('') +
      '</ol>' +
      (paketlar.length
        ? '<div class="dokon-paket">' + UI.nishon('gem') + '<span>Paketlar arzonroq: ' + UI.esc(paketlar.join(' • ')) + '</span>' +
            '<button class="matn-tugma" type="button" id="hammasi">Hammasini tanlash</button></div>'
        : '') +
      '<div id="fanRoyxat">' + d.subjects.map(function (s) {
        var rasm = s.image
          ? '<img src="' + UI.esc(s.image) + '" alt="">'
          : '<span class="dokon-belgi">' + UI.nishon(s.icon) + '</span>';
        return '<label class="dokon-fan" data-kalit="' + UI.esc(s.key) + '">' + rasm +
          '<span class="matn">' + UI.esc(s.name) + '<small>' + som(p.price_single) + '</small></span>' +
          '<input type="checkbox" value="' + UI.esc(s.key) + '"></label>';
      }).join('') + '</div>' +
      '<div class="dokon-promo">' +
        '<input class="kiritish" id="promoInput" placeholder="Promo-kod (ixtiyoriy)" maxlength="20" autocomplete="off">' +
        '<button class="tugma tugma-ikkilamchi" type="button" id="promoTugma">Qo\'llash</button>' +
      '</div>' +
      '<div class="karta dokon-jami" id="jami"></div>';

    document.querySelectorAll('.dokon-fan input').forEach(function (inp) {
      inp.checked = tanlangan.indexOf(inp.value) >= 0;
      inp.onchange = function () {
        tanlangan = Array.prototype.filter.call(document.querySelectorAll('.dokon-fan input'), function (x) { return x.checked; })
          .map(function (x) { return x.value; });
        belgila();
        hisobla();
      };
    });
    var hammasi = document.getElementById('hammasi');
    if (hammasi) hammasi.onclick = function () {
      tanlangan = d.subjects.map(function (s) { return s.key; });
      document.querySelectorAll('.dokon-fan input').forEach(function (x) { x.checked = true; });
      belgila();
      hisobla();
    };
    var promoInput = document.getElementById('promoInput');
    promoInput.value = promo;
    document.getElementById('promoTugma').onclick = function () {
      promo = promoInput.value.trim().toUpperCase();
      hisobla(true);
    };
    promoInput.onkeydown = function (e) { if (e.key === 'Enter') document.getElementById('promoTugma').click(); };
    belgila();
    hisobla();
    bogla();
  }

  function belgila() {
    document.querySelectorAll('.dokon-fan').forEach(function (l) {
      l.classList.toggle('tanlangan', tanlangan.indexOf(l.dataset.kalit) >= 0);
    });
  }

  function bogla() {
    document.querySelectorAll('[data-bot]').forEach(function (b) {
      b.onclick = function () { UI.botniOch(dokon && dokon.bot); };
    });
    var bekor = document.getElementById('bekorTugma');
    if (bekor) bekor.onclick = async function () {
      if (!(await UI.tasdiq('Buyurtma bekor qilinsinmi?'))) return;
      var r = await API.buyurtmaBekor(dokon.active_order.id);
      if (!r.ok) { UI.xabar(r.error, 'xato'); return; }
      UI.xabar('Buyurtma bekor qilindi', 'muvaffaqiyat');
      yukla();
    };
  }

  function jamiChiz(q, xato) {
    var el = document.getElementById('jami');
    if (!el) return;
    if (!tanlangan.length) {
      el.innerHTML = '<p class="izoh" style="text-align:center">Sotib olmoqchi bo\'lgan fanlarni tanlang.</p>';
      return;
    }
    if (!q) {
      el.innerHTML = '<p class="izoh" style="text-align:center">' + UI.esc(xato || 'Hisoblanmoqda...') + '</p>';
      return;
    }
    var qator = function (nom, qiymat, cls) {
      return '<div class="qator-summa' + (cls ? ' ' + cls : '') + '"><span>' + UI.esc(nom) + '</span><span>' + UI.esc(qiymat) + '</span></div>';
    };
    oxirgiNarx = q;
    var karta = !!dokon.configured;
    var starsYoqilgan = !!(dokon.stars_enabled && q.stars);   // admin yoqqan
    var stars = starsYoqilgan && starsMumkin();                // va Telegram ichidamiz
    if (usul === 'card' && !karta) usul = null;
    if (usul === 'stars' && !stars) usul = null;
    if (!usul) usul = karta ? 'card' : (stars ? 'stars' : null);

    var usulHtml = function (kalit, raqam, nom, izoh, narx, mumkin, sabab) {
      var tanlangan = usul === kalit;
      return '<label class="tolov-usul' + (tanlangan ? ' tanlangan' : '') + (mumkin ? '' : ' mavjud-emas') + '">' +
        '<input type="radio" name="usul" value="' + kalit + '"' + (tanlangan ? ' checked' : '') + (mumkin ? '' : ' disabled') + '>' +
        '<span class="usul-raqam" aria-hidden="true">' + raqam + '</span>' +
        '<span class="usul-matn"><b>' + nom + '</b><small>' + (mumkin ? izoh : sabab) + '</small></span>' +
        '<span class="usul-narx">' + narx + '</span></label>';
    };
    var tugmaMatn = usul === 'stars'
      ? UI.nishon('star') + '<span>Stars bilan to\'lash — ' + q.stars + ' Stars</span>'
      : UI.nishon('send') + '<span>Karta orqali to\'lash — ' + som(q.amount) + '</span>';

    el.innerHTML =
      qator(q.items.length + ' ta fan', som(q.base)) +
      (q.bundle ? qator(q.bundle, '−' + som(q.base - q.bundled), 'chegirma') : '') +
      (q.promo ? qator('Promo-kod ' + q.promo.code + ' (−' + q.promo.percent + '%)', '−' + som(q.discount), 'chegirma') : '') +
      qator('Jami', usul === 'stars' ? q.stars + ' Stars' : som(q.amount), 'jami') +
      '<div class="tolov-usullari" role="radiogroup" aria-labelledby="usulSarlavha">' +
        '<p class="usul-sarlavha" id="usulSarlavha">To\'lov usuli</p>' +
        usulHtml('card', 1, 'Karta orqali (admin bilan)',
          'Kartaga o\'tkazasiz, chek rasmini botga yuborasiz — admin tasdiqlagach fan ochiladi.',
          som(q.amount), karta, 'Hozircha mavjud emas') +
        (starsYoqilgan
          ? usulHtml('stars', 2, 'Telegram Stars', 'Telegram ichida to\'lanadi — fan darhol, admin kutmasdan ochiladi.',
              q.stars + ' Stars', stars, 'Faqat Telegram ilovasi ichida ishlaydi')
          : '') +
      '</div>' +
      (starsYoqilgan
        ? '<details class="stars-yordam"><summary>Telegram Stars nima va qanday olinadi?</summary>' +
            '<p>Stars — Telegram\'ning ichki to\'lov birligi. Ularni Telegram\'ning o\'zida sotib olasiz: ' +
            'Sozlamalar → «Mening Stars\'larim» yoki to\'lov oynasidagi «Stars sotib olish» tugmasi orqali — ' +
            'bank kartasi, Apple Pay yoki Google Pay bilan. To\'lov tugagach fan shu zahoti ochiladi.</p></details>'
        : '') +
      (usul
        ? '<button class="tugma" type="button" id="tolashTugma">' + tugmaMatn + '</button>'
        : '<p class="izoh" style="text-align:center">Hozircha to\'lov usuli mavjud emas.</p>');

    el.querySelectorAll('input[name="usul"]').forEach(function (inp) {
      inp.onchange = function () { usul = inp.value; jamiChiz(oxirgiNarx); };
    });
    var tugma = document.getElementById('tolashTugma');
    if (tugma) tugma.onclick = function () { if (usul === 'stars') starsTolov(); else buyurtma(); };
  }

  /** Telegram Stars faqat Telegram ilovasi ichida (openInvoice, Bot API 6.1+). Pastki menyu
   * tugmasidan ochilgan Mini App'da initData bo'sh bo'ladi, shuning uchun platforma bo'yicha aniqlanadi. */
  function starsMumkin() {
    var tg = window.Telegram && window.Telegram.WebApp;
    return !!(tg && tg.openInvoice && tg.platform && tg.platform !== 'unknown' &&
      tg.isVersionAtLeast && tg.isVersionAtLeast('6.1'));
  }

  async function starsTolov() {
    var btn = document.getElementById('tolashTugma');
    btn.disabled = true;
    var r = await API.starsBuyurtma(tanlangan, promo);
    if (!r.ok) { UI.xabar(r.error, 'xato'); btn.disabled = false; return; }
    Telegram.WebApp.openInvoice(r.link, function (holat) {
      if (holat === 'paid') { starsTolandi(r.order); return; }
      btn.disabled = false;
      if (holat === 'failed') UI.xabar("To'lov amalga oshmadi. Qayta urinib ko'ring.", 'xato');
    });
  }

  // To'lov Telegram'da bo'ldi — webhook fanni ochguncha bir necha soniya kutamiz
  function starsTolandi(o) {
    tana.innerHTML =
      '<div class="karta dokon-yuborildi">' +
        '<span class="belgi">' + UI.nishon('checkCircle') + '</span>' +
        '<h2>To\'lov qabul qilindi!</h2>' +
        '<p id="starsHolat">' + UI.esc(o.items.map(function (i) { return i.name; }).join(', ')) + ' ochilmoqda...</p>' +
        '<a class="tugma" href="subjects.html">Fanlarimga o\'tish</a>' +
      '</div>';
    var keys = o.items.map(function (i) { return i.key; });
    var urinish = 0;
    (function tekshir() {
      API.do_kon().then(function (d) {
        var hali = d.ok && d.subjects.some(function (s) { return keys.indexOf(s.key) >= 0; });
        if (d.ok && !hali) {
          document.getElementById('starsHolat').textContent = 'Fan(lar) ochildi. O\'qishda omad!';
          try { Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch (e) { /* brauzerda yo'q */ }
        } else if (++urinish < 10) {
          setTimeout(tekshir, 1500);
        }
      });
    })();
  }

  function hisobla(promoTekshir) {
    clearTimeout(hisobTimer);
    if (!tanlangan.length) { jamiChiz(null); return; }
    jamiChiz(null);
    var raqam = ++oxirgiHisob;
    hisobTimer = setTimeout(async function () {
      var r = await API.narxHisobla(tanlangan, promo);
      if (raqam !== oxirgiHisob) return;
      if (!r.ok && r.code === 'bad_promo') {
        UI.xabar(r.error, 'xato');
        promo = '';
        var inp = document.getElementById('promoInput');
        if (inp) inp.value = '';
        hisobla();
        return;
      }
      if (!r.ok) { jamiChiz(null, r.error); return; }
      if (promoTekshir && r.promo) UI.xabar('Promo-kod qo\'llandi: −' + r.promo.percent + '%', 'muvaffaqiyat');
      jamiChiz(r);
    }, 200);
  }

  async function buyurtma() {
    var btn = document.getElementById('tolashTugma');
    btn.disabled = true;
    btn.lastChild.textContent = 'Yuborilmoqda...';
    var r = await API.buyurtmaBer(tanlangan, promo);
    if (!r.ok) {
      UI.xabar(r.error, 'xato');
      if (r.code === 'pending_exists') yukla();
      else jamiChiz(oxirgiNarx);          // tugmani asl holatiga qaytaradi
      return;
    }
    var o = r.order;
    tana.innerHTML =
      '<div class="karta dokon-yuborildi">' +
        '<span class="belgi">' + UI.nishon('checkCircle') + '</span>' +
        '<h2>' + (r.bot_sent ? 'Yo\'riqnoma botga yuborildi!' : 'Buyurtma yaratildi') + '</h2>' +
        '<p>Buyurtma <b>' + UI.esc(o.code) + '</b> • ' + som(o.amount) + '<br>' +
          (r.bot_sent
            ? 'Botda karta raqami bor: to\'lovni qiling va chek rasmini botga yuboring. Admin tasdiqlagach fan ochiladi.'
            : 'Bot sizga yoza olmadi. Botni oching va «Start» tugmasini bosing — yo\'riqnoma keladi.') + '</p>' +
        '<button class="tugma" type="button" id="botTugma">' + UI.nishon('send') + '<span>Botni ochish</span></button>' +
      '</div>';
    document.getElementById('botTugma').onclick = function () { UI.botniOch(r.bot, r.bot_sent ? '' : 'pay'); };
    if (r.bot_sent) setTimeout(function () { UI.botniOch(r.bot); }, 900);
  }

  yukla();
  // Botdan qaytganda holatni yangilash (chek yuborilgan yoki tasdiqlangan bo'lishi mumkin)
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && dokon && dokon.active_order) yukla();
  });
})();
</script>
</body>
</html>
