<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurslar — BilimSari</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BilimSari">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/apple-touch-icon-120.png">
  <meta name="theme-color" content="#58A700">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f2f2f2;color:#3c3c3c;padding-bottom:80px}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:560px;margin:0 auto;padding:24px 16px}
    h1{font-size:28px;font-weight:800;margin-bottom:6px}
    .sub{color:#777;margin-bottom:20px;font-size:15px}
    .card{background:#fff;border:2px solid #e5e5e5;border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer;transition:.15s;display:flex;gap:14px;align-items:center}
    .card:hover{border-color:#58A700;transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.06)}
    .ico{width:52px;display:flex;align-items:center;justify-content:center}.ico svg{width:32px;height:32px}
    .card h3{font-size:17px;font-weight:800}
    .card p{font-size:13px;color:#777;margin-top:2px}
    .bar{height:8px;background:#e5e5e5;border-radius:99px;margin-top:10px;overflow:hidden}
    .bar span{display:block;height:100%;background:#58A700;border-radius:99px}
    .bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #e5e5e5;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:50}
    .bnav-inner{max-width:480px;width:100%;display:flex;justify-content:space-around}
    .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;font-size:11px;font-weight:700;color:#afafaf}
    .bnav a.active{color:#58A700}
    .bnav a span{font-size:22px}.nav-ico{display:flex;align-items:center;justify-content:center;height:24px}.nav-ico svg{width:22px;height:22px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Kurslar</h1>
    <p class="sub">O‘rganmoqchi bo‘lgan fanni tanlang</p>
    <div id="list"></div>
  </div>
  <nav class="bnav"><div class="bnav-inner">
    <a href="learn.html"><span class="nav-ico" data-icon="home"></span data-i18n="learn">O‘rganish</a>
    <a href="courses.html" class="active"><span class="nav-ico" data-icon="book"></span data-i18n="courses">Kurslar</a>
    <a href="leaderboard.html"><span class="nav-ico" data-icon="trophy"></span data-i18n="rating">Reyting</a>
    <a href="review.html"><span class="nav-ico" data-icon="refresh"></span data-i18n="review">Takrorlash</a>
    <a href="profile.html"><span class="nav-ico" data-icon="user"></span data-i18n="profile">Profil</a>
  </div></nav>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/game.js"></script>
  <script src="js/data.js"></script>
  <script>
    requireAuth();
    if (window.BS_I18N) BS_I18N.apply(document);
    document.querySelectorAll('.nav-ico').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
    const list = document.getElementById('list');
    COURSES.forEach(c => {
      const total = allLessons(c).length;
      const p = courseProgress(c.id, total);
      const el = document.createElement('div');
      el.className = 'card';
      el.onclick = () => location.href = 'learn.html?course=' + c.id;
      el.innerHTML = `<div class="ico" style="color:${c.color}">${icon(c.icon)}</div>
        <div style="flex:1">
          <h3>${c.name}</h3>
          <p>${c.desc} · ${p.done}/${total} dars</p>
          <div class="bar"><span style="width:${p.pct}%"></span></div>
        </div>`;
      list.appendChild(el);
    });
  </script>
</body>
</html>
