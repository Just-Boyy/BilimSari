<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8FB">
<title>Kirish — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="no-nav">

<main class="markaz">
  <div class="logo-qator">
    <span class="logo-belgi" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 72 72" fill="none" stroke="currentColor"
           stroke-width="3.4" stroke-linejoin="round">
        <path d="M36 6l8 14 16 2-12 11 3 16-15-8-15 8 3-16L12 22l16-2z"/>
      </svg>
    </span>
    <b>BilimSari</b>
  </div>

  <h1 style="margin-bottom:6px">Xush kelibsiz</h1>
  <p class="izoh" style="margin-bottom:24px">Davom etish uchun hisobingizga kiring.</p>

  <form id="forma" novalidate>
    <div class="maydon">
      <label for="email">Email</label>
      <input class="kiritish" type="email" id="email" name="email" autocomplete="email"
             placeholder="ism@example.com" required>
    </div>
    <div class="maydon">
      <label for="parol">Parol</label>
      <input class="kiritish" type="password" id="parol" name="parol"
             autocomplete="current-password" placeholder="Parolingiz" required>
    </div>
    <p id="xato" class="izoh" style="color:var(--qizil);min-height:1.4em;margin:0 0 12px"></p>
    <button class="tugma" type="submit" id="yubor">Kirish</button>
  </form>

  <p class="izoh" style="text-align:center;margin-top:20px">
    Hisobingiz yo'qmi? <a href="register.html"><b>Ro'yxatdan o'ting</b></a>
  </p>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(function () {
  var qaytish = new URLSearchParams(location.search).get('qaytish');

  function keyingiSahifa(user) {
    if (qaytish && /^[\w.-]+\.html(\?.*)?$/.test(qaytish)) return qaytish;
    return (user && user.grade) ? 'dashboard.html' : 'onboarding.html';
  }

  // Telegram ichida bo'lsak avtomatik kiramiz
  (async function () {
    if (window.BilimSariTG && typeof BilimSariTG.autoAuthIfTelegram === 'function') {
      try {
        var ok = await BilimSariTG.autoAuthIfTelegram();
        if (ok && API.kirganmi()) location.replace(keyingiSahifa(API.user()));
      } catch (e) {}
    }
  })();

  document.getElementById('forma').onsubmit = async function (e) {
    e.preventDefault();
    var xato = document.getElementById('xato');
    var tugma = document.getElementById('yubor');
    var email = document.getElementById('email').value.trim();
    var parol = document.getElementById('parol').value;

    xato.textContent = '';
    if (!email || !parol) { xato.textContent = 'Email va parolni kiriting.'; return; }

    tugma.disabled = true;
    tugma.textContent = 'Tekshirilmoqda...';

    var res = await API.kirish(email, parol);

    tugma.disabled = false;
    tugma.textContent = 'Kirish';

    if (!res.ok) { xato.textContent = res.error; return; }

    API.sessiyaOchish(res.token, res.user);
    location.href = keyingiSahifa(res.user);
  };
})();
</script>
</body>
</html>
