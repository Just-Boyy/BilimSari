<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Profil — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
<style>
  .fp-bosh { text-align: center; padding: 8px 0 4px; }
  .fp-bosh .avatar { width: 84px; height: 84px; font-size: 2rem; margin: 0 auto; }
  .fp-bosh h1 { display: flex; justify-content: center; align-items: center; gap: 2px; font-size: 22px; margin-top: 12px; }
  .fp-bosh .sinf { display: inline-block; margin-top: 6px; }
  .fp-avatar { display: grid; place-items: center; margin: 14px auto 0; }
  .fp-avatar .ramkali { margin: 6px 0; }
  .fp-stat { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .fp-stat .stat b { font-size: 19px; }
  .fp-nishonlar { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
</style>
<script src="js/i18n.js"></script>
</head>
<body>

<div class="ustki">
  <a class="orqaga" href="leaderboard.html" id="orqaga" aria-label="Orqaga">←</a>
  <h1>Profil<small id="ustkiIzoh">O'quvchi profili</small></h1>
</div>

<main class="sahifa" style="padding-top:12px">
  <div id="tana">
    <div class="skelet" style="height:190px;margin-bottom:12px"></div>
    <div class="skelet" style="height:160px"></div>
  </div>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  if (!(await UI.sessiyaKerak())) return;
  UI.navChiz('foydalanuvchi.html');
  var tana = document.getElementById('tana');
  var orqaga = document.getElementById('orqaga');
  // Qayerdan kelgan bo'lsa (reyting, kun savoli, o'yinlar) — o'sha joyga qaytadi
  orqaga.onclick = function (e) {
    if (document.referrer && document.referrer.indexOf(location.host) >= 0 && history.length > 1) {
      e.preventDefault();
      history.back();
    }
  };

  var id = parseInt(new URLSearchParams(location.search).get('id'), 10);
  if (!id) { tana.innerHTML = UI.holat({ belgi: 'user', sarlavha: "O'quvchi topilmadi", matn: '' }); return; }

  async function yukla() {
    var r = await API.get('/api/study/profile/' + id);
    if (!r.ok) {
      tana.innerHTML = r.code === 'not_found'
        ? UI.holat({ belgi: 'user', sarlavha: "O'quvchi topilmadi", matn: "Bu o'quvchi ilovadan o'chirilgan bo'lishi mumkin." })
        : UI.xatoHolat(r.error, yukla);
      return;
    }
    var p = r.profile;
    if (p.me) { location.replace('profile.html'); return; }
    chiz(p);
  }

  function chiz(p) {
    var pr = p.premium || {};
    var av = p.photo_url
      ? '<img class="avatar" alt="" src="' + UI.esc(p.photo_url) + '">'
      : '<div class="avatar" aria-hidden="true">' + UI.esc(UI.harfAvatar(p.name)) + '</div>';
    var stat = function (b, s) { return '<div class="stat"><b>' + b + '</b><span>' + UI.esc(s) + '</span></div>'; };
    var g = p.games || {};
    var m = g.medals || {};
    var medallar = [[m.gold, 'oltin'], [m.silver, 'kumush'], [m.bronze, 'bronza']]
      .filter(function (x) { return x[0]; }).map(function (x) { return x[0] + ' ' + x[1]; }).join(', ');
    var nishonlar = (p.badges && p.badges.items) || [];
    // Tanlangan (avatar atrofidagi) nishonlar birinchi, keyin eng qiyinlari
    var DARAJA_TARTIB = { premium: 0, brilyant: 1, oltin: 2, kumush: 3, bronza: 4 };
    var pinned = (p.badges && p.badges.pinned) || [];
    nishonlar.sort(function (a, b) {
      var pa = pinned.indexOf(a.key), pb = pinned.indexOf(b.key);
      if ((pa >= 0) !== (pb >= 0)) return pa >= 0 ? -1 : 1;
      if (pa >= 0) return pa - pb;
      return (DARAJA_TARTIB[a.tier] || 9) - (DARAJA_TARTIB[b.tier] || 9) || b.unlocked_ms - a.unlocked_ms;
    });

    document.title = p.name + ' — BilimSari';
    document.getElementById('ustkiIzoh').textContent = p.rank ? p.rank + "-o'rin reytingda" : "O'quvchi profili";
    tana.innerHTML =
      '<section class="fp-bosh">' +
        '<div class="fp-avatar">' + UI.ramkali(av, pr.active && pr.frame) + '</div>' +
        '<h1><span>' + UI.esc(p.name) + '</span>' + UI.emoji(pr.active && pr.emoji) + '</h1>' +
        (pr.active ? '<p style="margin:6px 0 2px"><span class="premium-pill">' + UI.nishon('crown') + '<span>Bilim Premium</span></span></p>' : '') +
        (p.grade ? '<span class="sinf">' + p.grade + '-sinf</span>' : '') +
      '</section>' +
      '<section class="bo-lim">' +
        '<div class="fp-stat">' +
          stat(String(p.chaqmoq), 'Chaqmoq') +
          stat(p.rank ? p.rank + ' / ' + p.total_players : '—', 'Reytingdagi o\'rin') +
          stat(String(p.streak), 'Kunlik streak') +
          stat(String(p.topics), 'Tugatilgan mavzular') +
        '</div>' +
      '</section>' +
      '<section class="bo-lim">' +
        '<div class="bo-lim-bosh"><h2>O\'yinlar</h2><span class="izoh">Daraja ' + (g.level || 1) + '</span></div>' +
        (g.games
          ? '<div class="stat-setka stat-setka-4">' +
              stat(String(g.games), "O'yin") + stat(String(g.wins), "G'alaba") +
              stat(g.accuracy + '%', 'Aniqlik') + stat(String(g.xp), 'Ball') +
            '</div>' + (medallar ? '<p class="izoh" style="margin-top:10px">Turnir medallari: ' + UI.esc(medallar) + '</p>' : '')
          : '<p class="izoh">Hali o\'yin o\'ynamagan.</p>') +
      '</section>' +
      '<section class="bo-lim">' +
        '<div class="bo-lim-bosh"><h2>Yutuqlar</h2><span class="izoh">' + p.badges.unlocked + ' / ' + p.badges.total + '</span></div>' +
        (nishonlar.length
          ? '<div class="fp-nishonlar">' + nishonlar.map(function (a) {
              return '<div class="yutuq"><span class="yutuq-belgi d-' + UI.daraja(a.tier) + '">' + UI.nishon(a.icon) + '</span>' +
                '<b>' + UI.esc(a.title) + '</b>' +
                '<span class="daraja-yorliq d-' + UI.daraja(a.tier) + '">' + UI.darajaNomi(a.tier) + '</span>' +
                '<small>' + UI.esc(a.desc) + '</small></div>';
            }).join('') + '</div>'
          : '<p class="izoh">Hali nishon olmagan.</p>') +
      '</section>';
  }

  yukla();
})();
</script>
</body>
</html>
