<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Profil — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
<style>
  .fp-bosh { text-align: center; padding: 8px 0 4px; }
  .fp-bosh .avatar { width: 84px; height: 84px; font-size: 2rem; margin: 0 auto; }
  .fp-bosh h1 { display: flex; justify-content: center; align-items: center; gap: 2px; font-size: 22px; margin-top: 12px; }
  .fp-bosh .sinf { display: inline-block; margin-top: 6px; }
  .fp-avatar { display: grid; place-items: center; margin: 14px auto 0; }
  .fp-avatar .ramkali { margin: 6px 0; }
  .fp-stat { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .fp-stat .stat b { font-size: 19px; }
  .fp-nishonlar { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .fp-dostlar-soni { display: block; margin-top: 6px; color: var(--matn-2); font-size: 14px; font-weight: 700; }
  .fp-dost { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
  .fp-dost .tugma { width: auto; min-height: 44px; padding: 10px 22px; font-size: 15px; border-radius: 999px; white-space: nowrap; }
  .fp-dost .tugma svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .fp-dost .izoh { flex-basis: 100%; margin: 0; }
  .fp-dost-belgi { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px;
    background: var(--yashil-fon); color: var(--yashil-quyuq); font-weight: 800; }
  .fp-dost-belgi svg { width: 18px; height: 18px; }
  .fp-shikoyat { display: block; margin: 18px auto 4px; }
  .shikoyat-sabablar { display: grid; gap: 8px; margin: 12px 0; }
  .shikoyat-sabablar label { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 2px solid var(--chiziq);
    border-radius: 14px; font-weight: 700; cursor: pointer; }
  .shikoyat-sabablar input { accent-color: var(--yashil); width: 18px; height: 18px; }
  .shikoyat-sabablar label:has(input:checked) { border-color: var(--yashil); background: var(--yashil-fon); }
  #shikoyatIzoh { width: 100%; min-height: 70px; resize: vertical; }
</style>
<script src="js/i18n.js"></script>
</head>
<body>

<div class="ustki">
  <a class="orqaga" href="leaderboard.html" id="orqaga" aria-label="Orqaga">←</a>
  <h1>Profil<small id="ustkiIzoh">O'quvchi profili</small></h1>
</div>

<main class="sahifa" style="padding-top:12px">
  <div id="tana">
    <div class="skelet" style="height:190px;margin-bottom:12px"></div>
    <div class="skelet" style="height:160px"></div>
  </div>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  if (!(await UI.sessiyaKerak())) return;
  UI.navChiz('foydalanuvchi.html');
  var tana = document.getElementById('tana');
  var orqaga = document.getElementById('orqaga');
  // Qayerdan kelgan bo'lsa (reyting, kun savoli, o'yinlar) — o'sha joyga qaytadi
  orqaga.onclick = function (e) {
    if (document.referrer && document.referrer.indexOf(location.host) >= 0 && history.length > 1) {
      e.preventDefault();
      history.back();
    }
  };

  var id = parseInt(new URLSearchParams(location.search).get('id'), 10);
  if (!id) { tana.innerHTML = UI.holat({ belgi: 'user', sarlavha: "O'quvchi topilmadi", matn: '' }); return; }

  async function yukla() {
    var r = await API.get('/api/study/profile/' + id);
    if (!r.ok) {
      tana.innerHTML = r.code === 'not_found'
        ? UI.holat({ belgi: 'user', sarlavha: "O'quvchi topilmadi", matn: "Bu o'quvchi ilovadan o'chirilgan bo'lishi mumkin." })
        : UI.xatoHolat(r.error, yukla);
      return;
    }
    var p = r.profile;
    if (p.me) { location.replace('profile.html'); return; }
    chiz(p);
  }

  function chiz(p) {
    var pr = p.premium || {};
    var av = p.photo_url
      ? '<img class="avatar" alt="" src="' + UI.esc(p.photo_url) + '">'
      : '<div class="avatar" aria-hidden="true">' + UI.esc(UI.harfAvatar(p.name)) + '</div>';
    var stat = function (b, s) { return '<div class="stat"><b>' + b + '</b><span>' + UI.esc(s) + '</span></div>'; };
    var g = p.games || {};
    var m = g.medals || {};
    var medallar = [[m.gold, 'oltin'], [m.silver, 'kumush'], [m.bronze, 'bronza']]
      .filter(function (x) { return x[0]; }).map(function (x) { return x[0] + ' ' + x[1]; }).join(', ');
    var nishonlar = (p.badges && p.badges.items) || [];
    // Tanlangan (avatar atrofidagi) nishonlar birinchi, keyin eng qiyinlari
    var DARAJA_TARTIB = { premium: 0, brilyant: 1, oltin: 2, kumush: 3, bronza: 4 };
    var pinned = (p.badges && p.badges.pinned) || [];
    nishonlar.sort(function (a, b) {
      var pa = pinned.indexOf(a.key), pb = pinned.indexOf(b.key);
      if ((pa >= 0) !== (pb >= 0)) return pa >= 0 ? -1 : 1;
      if (pa >= 0) return pa - pb;
      return (DARAJA_TARTIB[a.tier] || 9) - (DARAJA_TARTIB[b.tier] || 9) || b.unlocked_ms - a.unlocked_ms;
    });

    document.title = p.name + ' — BilimSari';
    document.getElementById('ustkiIzoh').textContent = p.rank ? p.rank + "-o'rin reytingda" : "O'quvchi profili";
    tana.innerHTML =
      '<section class="fp-bosh">' +
        '<div class="fp-avatar">' + UI.ramkali(av, pr.active && pr.frame) + '</div>' +
        '<h1><span>' + UI.esc(p.name) + '</span>' + UI.emoji(pr.active && pr.emoji) + '</h1>' +
        (pr.active ? '<p style="margin:6px 0 2px"><span class="premium-pill">' + UI.nishon('crown') + '<span>Bilim Premium</span></span></p>' : '') +
        (p.grade ? '<span class="sinf">' + p.grade + '-sinf</span>' : '') +
        '<span class="fp-dostlar-soni">' + p.friends_count + ' ' + I18N.t("do'st") + '</span>' +
        '<div class="fp-dost" id="fpDost"></div>' +
      '</section>' +
      '<section class="bo-lim">' +
        '<div class="fp-stat">' +
          stat(String(p.chaqmoq), 'Chaqmoq') +
          stat(p.rank ? p.rank + ' / ' + p.total_players : '—', 'Reytingdagi o\'rin') +
          stat(String(p.streak), 'Kunlik streak') +
          stat(String(p.topics), 'Tugatilgan mavzular') +
        '</div>' +
      '</section>' +
      '<section class="bo-lim">' +
        '<div class="bo-lim-bosh"><h2>O\'yinlar</h2><span class="izoh">Daraja ' + (g.level || 1) + '</span></div>' +
        (g.games
          ? '<div class="stat-setka stat-setka-4">' +
              stat(String(g.games), "O'yin") + stat(String(g.wins), "G'alaba") +
              stat(g.accuracy + '%', 'Aniqlik') + stat(String(g.xp), 'Ball') +
            '</div>' + (medallar ? '<p class="izoh" style="margin-top:10px">Turnir medallari: ' + UI.esc(medallar) + '</p>' : '')
          : '<p class="izoh">Hali o\'yin o\'ynamagan.</p>') +
      '</section>' +
      '<section class="bo-lim">' +
        '<div class="bo-lim-bosh"><h2>Yutuqlar</h2><span class="izoh">' + p.badges.unlocked + ' / ' + p.badges.total + '</span></div>' +
        (nishonlar.length
          ? '<div class="fp-nishonlar">' + nishonlar.map(function (a) {
              return '<div class="yutuq"><span class="yutuq-belgi d-' + UI.daraja(a.tier) + '">' + UI.nishon(a.icon) + '</span>' +
                '<b>' + UI.esc(a.title) + '</b>' +
                '<span class="daraja-yorliq d-' + UI.daraja(a.tier) + '">' + UI.darajaNomi(a.tier) + '</span>' +
                '<small>' + UI.esc(a.desc) + '</small></div>';
            }).join('') + '</div>'
          : '<p class="izoh">Hali nishon olmagan.</p>') +
      '</section>' +
      '<button class="matn-tugma fp-shikoyat" type="button" id="shikoyatBtn">Shikoyat qilish</button>';
    dostChiz(p);
    document.getElementById('shikoyatBtn').onclick = function () { shikoyatOyna(p); };
  }

  // ── Do'stlik tugmasi: holatga qarab ──
  var XABARLAR = { sorov: "So'rov yuborildi", bekor: "So'rov bekor qilindi", qabul: "Endi do'stsiz!",
                   rad: "So'rov rad etildi", ochir: "Do'stlikdan chiqarildi" };
  function dostChiz(p) {
    var el = document.getElementById('fpDost');
    var f = p.friend || { state: 'none' };
    if (f.state === 'friend') {
      el.innerHTML = '<span class="fp-dost-belgi">' + UI.nishon('check') + '<span>Do\'stingiz</span></span>' +
        '<button class="matn-tugma" type="button" data-d="ochir">Do\'stlikdan chiqarish</button>';
    } else if (f.state === 'outgoing') {
      el.innerHTML = '<button class="tugma tugma-ikkilamchi" type="button" disabled>So\'rov yuborildi</button>' +
        '<button class="matn-tugma" type="button" data-d="bekor">Bekor qilish</button>';
    } else if (f.state === 'incoming') {
      el.innerHTML = '<p class="izoh">' + UI.esc(I18N.t("Sizga do'stlik so'rovi yubordi")) + '</p>' +
        '<button class="tugma" type="button" data-d="qabul">Qabul qilish</button>' +
        '<button class="tugma tugma-ikkilamchi" type="button" data-d="rad">Rad etish</button>';
    } else {
      el.innerHTML = '<button class="tugma" type="button" data-d="sorov">' + UI.nishon('plus') + '<span>Do\'st qo\'shish</span></button>';
    }
    el.querySelectorAll('[data-d]').forEach(function (b) {
      b.onclick = async function () {
        var d = b.dataset.d, r;
        if (d === 'ochir' && !(await UI.tasdiq(p.name + ' — ' + I18N.t("do'stlikdan chiqarilsinmi?")))) return;
        b.disabled = true;
        if (d === 'sorov') r = await API.dostSorov(p.id);
        else if (d === 'bekor') r = await API.dostBekor(f.request_id);
        else if (d === 'qabul' || d === 'rad') r = await API.dostJavob(f.request_id, d === 'qabul');
        else r = await API.dostOchir(p.id);
        if (!r.ok) { UI.xabar(r.error, 'xato'); b.disabled = false; return; }
        var oldin = f.state;
        p.friend = { state: r.state, request_id: r.request_id };
        if (r.state === 'friend' && oldin !== 'friend') p.friends_count++;
        if (r.state !== 'friend' && oldin === 'friend') p.friends_count = Math.max(0, p.friends_count - 1);
        document.querySelector('.fp-dostlar-soni').textContent = p.friends_count + ' ' + I18N.t("do'st");
        // O'sha o'quvchi ham so'rov yuborgan bo'lsa — darhol do'st bo'lamiz
        UI.xabar(d === 'sorov' && r.state === 'friend' ? XABARLAR.qabul : XABARLAR[d],
                 r.state === 'friend' ? 'muvaffaqiyat' : '');
        dostChiz(p);
      };
    });
  }

  // ── Shikoyat oynasi ──
  var SABABLAR = [['ism', 'Nomaqbul ism'], ['rasm', 'Nomaqbul rasm'], ['haqorat', 'Haqorat yoki bezorilik'], ['boshqa', 'Boshqa']];
  function shikoyatOyna(p) {
    if (document.getElementById('shikoyatOyna')) return;
    var oyna = document.createElement('div');
    oyna.id = 'shikoyatOyna';
    oyna.className = 'pastki-oyna';
    oyna.innerHTML = '<div class="pastki-oyna-karta" role="dialog" aria-modal="true" aria-labelledby="shikoyatSarlavha">' +
      '<h2 id="shikoyatSarlavha" style="font-size:19px">' + UI.esc(I18N.t('Shikoyat qilish')) + '</h2>' +
      '<p class="izoh">' + UI.esc(p.name) + ' — ' + UI.esc(I18N.t("sababni tanlang. Admin ko'rib chiqadi.")) + '</p>' +
      '<div class="shikoyat-sabablar">' + SABABLAR.map(function (s) {
        return '<label><input type="radio" name="sabab" value="' + s[0] + '"><span>' + UI.esc(I18N.t(s[1])) + '</span></label>';
      }).join('') + '</div>' +
      '<textarea class="kiritish" id="shikoyatIzoh" maxlength="300" placeholder="' + UI.esc(I18N.t('Izoh (ixtiyoriy)')) + '"></textarea>' +
      '<div class="tugmalar" style="margin-top:12px">' +
        '<button class="tugma tugma-ikkilamchi" type="button" data-yop>' + UI.esc(I18N.t('Bekor qilish')) + '</button>' +
        '<button class="tugma" type="button" id="shikoyatYubor">' + UI.esc(I18N.t('Yuborish')) + '</button>' +
      '</div></div>';
    document.body.appendChild(oyna);
    function yop() { oyna.remove(); }
    oyna.addEventListener('click', function (e) { if (e.target === oyna || e.target.closest('[data-yop]')) yop(); });
    document.getElementById('shikoyatYubor').onclick = async function () {
      var t = oyna.querySelector('input[name=sabab]:checked');
      if (!t) { UI.xabar('Sababni tanlang.', 'xato'); return; }
      var btn = this;
      btn.disabled = true;
      var r = await API.shikoyat(p.id, t.value, document.getElementById('shikoyatIzoh').value);
      if (!r.ok) { UI.xabar(r.error, 'xato'); btn.disabled = false; return; }
      yop();
      UI.xabar('Shikoyatingiz yuborildi. Rahmat!', 'muvaffaqiyat');
    };
  }

  yukla();
})();
</script>
</body>
</html>
