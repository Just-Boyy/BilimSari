<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Profil — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
<style>
  .profil-bosh { text-align: center; }
  .profil-bosh .avatar {
    width: 84px; height: 84px; font-size: 2rem; margin: 0 auto;
  }

  /* Avatar atrofidagi nishonlar (Telegram profilidagi sovg'alar kabi) */
  .avatar-orbita { position: relative; width: 84px; margin: 0 auto 12px; }
  .yutuq-belgi.orbita-nishon {
    position: absolute; left: 50%; top: 50%;
    width: var(--s); height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    padding: 0;
    border: 2px solid #fff;
    box-shadow: 0 2px 0 #b45309, 0 6px 14px rgba(180, 83, 9, .22);
    cursor: pointer;
    transform: translate(var(--x), var(--y));
    animation: orbitaKir .45s cubic-bezier(.2, 1.4, .4, 1) var(--d) backwards,
               orbitaSuz 3.4s ease-in-out calc(var(--d) + .45s) infinite alternate;
  }
  .yutuq-belgi.orbita-nishon svg { width: 56%; height: 56%; }
  @keyframes orbitaKir { from { opacity: 0; scale: .3; } }
  @keyframes orbitaSuz { to { transform: translate(var(--x), calc(var(--y) - 6px)); } }

  /* Yuqori o'ng burchakdagi Sozlamalar tugmasi */
  .profil-shapka { position: relative; }
  .sozlama-tugma {
    position: absolute; top: 14px; right: 14px;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--oq);
    border: 1px solid var(--chiziq);
    box-shadow: var(--soya);
    color: var(--matn-2);
  }
  .sozlama-tugma:active { transform: scale(.94); }
  .sozlama-tugma svg { width: 22px; height: 22px; }

  /* Hamkorlik (faqat admin hamkor qilib belgilagan o'quvchida ko'rinadi) */
  .hk-kod {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px; border-radius: var(--r-katta); color: #fff;
    background: linear-gradient(135deg, #14532d 0%, #166534 60%, #15803d 100%);
    box-shadow: 0 10px 24px rgba(20, 83, 45, .22);
  }
  .hk-kod small { display: block; font-size: 12px; color: rgba(255, 255, 255, .8); }
  .hk-kod b { display: block; font-family: var(--sarlavha); font-size: 26px; letter-spacing: 1px; color: #fde68a; }
  .hk-kod .hk-foiz { text-align: right; font-size: 12px; color: rgba(255, 255, 255, .85); line-height: 1.5; }
  .hk-kod .hk-foiz strong { font-size: 18px; color: #fff; }
  .hk-stat { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  .hk-stat .stat b { font-size: 17px; }
  .hk-stat .stat.asosiy { border-color: #f5b301; background: #fffbeb; }
  .hk-stat .stat.asosiy b { color: #b45309; }
  .hk-pogona { margin-top: 12px; font-size: 13px; color: var(--matn-2); }
  .hk-pogona .progress { margin-top: 6px; }
  .hk-toxtatilgan { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #fef2f2; color: #b91c1c; font-size: 13px; }
  .hk-matn {
    margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--fon); border: 1px dashed var(--chiziq);
    font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: var(--matn);
  }
  #hamkor .tugma svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .hk-royxat { margin-top: 14px; }
  .hk-royxat h3 { font-size: 14px; margin-bottom: 6px; }
  .hk-qator { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--chiziq); font-size: 13px; }
  .hk-qator:first-of-type { border-top: 0; }
  .hk-qator small { display: block; color: var(--matn-2); font-size: 11px; }
  .hk-qator .plus { font-weight: 800; color: var(--yashil-quyuq); white-space: nowrap; }
  .hk-qator .minus { font-weight: 800; color: #0369a1; white-space: nowrap; }
</style>
<script src="js/i18n.js"></script>
</head>
<body>

<header class="shapka profil-shapka">
  <a class="sozlama-tugma" href="settings.html" aria-label="Sozlamalar" data-ikon="settings"></a>
  <div class="profil-bosh">
    <div class="avatar-orbita" id="avatarOrbita">
      <div class="avatar" id="avatar" aria-hidden="true">?</div>
    </div>
    <h1 id="ism">Yuklanmoqda...</h1>
    <span class="sinf" id="sinfYorliq" hidden></span>
  </div>
</header>

<main class="sahifa">
  <!-- Hamkorlik: promo-kod, sotuvlar, komissiya va ulashish (faqat hamkorlarda) -->
  <section class="bo-lim" id="hamkor" hidden>
    <div class="bo-lim-bosh"><h2>Hamkorlik</h2><span class="izoh" id="hamkorHolat"></span></div>
    <div id="hamkorTana"></div>
  </section>

  <!-- Yutuqlar: ochilgan va yopiq nishonlar -->
  <section class="bo-lim" id="yutuqlar" hidden>
    <div class="bo-lim-bosh"><h2>Yutuqlar</h2><span class="izoh" id="yutuqSoni"></span></div>
    <div class="yutuq-javon" id="yutuqJavon"></div>
    <button class="tugma tugma-ikkilamchi tugma-mayda" type="button" id="yutuqHammasi" style="margin-top:10px" hidden></button>
  </section>

  <!-- O'yinlar statistikasi (Game Hub) — ma'lumot kelgach ko'rinadi -->
  <section class="bo-lim" id="oyinBolim" hidden>
    <div class="bo-lim-bosh"><h2>O'yinlar</h2><a class="izoh" href="games.html">O'yinlarga o'tish ›</a></div>
    <div id="oyinTana"></div>
  </section>

  <section class="bo-lim">
    <a class="qator" href="game.html">
      <span class="nishon" data-ikon="sparkle"></span>
      <span class="matn">Mashq<small>Qo'shimcha, dastur tashqarisidagi darslar</small></span>
      <span class="o-q" data-ikon="chevronRight"></span>
    </a>
  </section>

  <p class="izoh-kichik" style="text-align:center;margin-top:20px">
    BilimSari — o'zbek maktab o'quvchilari uchun
  </p>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  if (!(await UI.sessiyaKerak())) return;
  UI.navChiz('profile.html');

  // data-ikon belgilarini SVG ga aylantiramiz
  document.querySelectorAll('[data-ikon]').forEach(function (el) {
    el.innerHTML = UI.nishon(el.dataset.ikon);
  });

  var d = await API.dashboard();
  if (!d.ok) { UI.xabar(d.error, 'xato'); return; }

  var u = d.user || API.user() || {};
  var ism = u.name || 'O\'quvchi';

  var pr = u.premium || {};
  document.getElementById('ism').innerHTML = '<span>' + UI.esc(ism) + '</span>' + UI.emoji(pr.active && pr.emoji);
  var av = document.getElementById('avatar');
  if (u.photo_url) {
    av.outerHTML = '<img class="avatar' + (pr.active ? ' premium-halqa' : '') + '" alt="" src="' + UI.esc(u.photo_url) + '">';
  } else {
    av.textContent = UI.harfAvatar(ism);
    av.classList.toggle('premium-halqa', !!pr.active);
  }
  if (pr.active) {
    document.getElementById('ism').insertAdjacentHTML('afterend',
      '<p style="text-align:center;margin:6px 0 2px"><a class="premium-pill" href="premium.html">' +
      UI.nishon('crown') + '<span>Bilim Premium</span></a></p>');
  }

  UI.yutuqTabrik(d.new_achievements);

  var KO_RINADI = 6;   // javonda dastlab nechta nishon ko'rinadi
  API.yutuqlar().then(function (y) {
    if (!y.ok) return;
    document.getElementById('yutuqSoni').textContent = y.unlocked + ' / ' + y.total;
    // Olinganlar oldinda, keyin maqsadga eng yaqinlari
    var tartib = y.items.map(function (a, i) { return { a: a, i: i }; }).sort(function (p, q) {
      if (p.a.unlocked !== q.a.unlocked) return p.a.unlocked ? -1 : 1;
      var d = q.a.progress / q.a.goal - p.a.progress / p.a.goal;
      return d || p.i - q.i;
    }).map(function (x) { return x.a; });
    var javon = document.getElementById('yutuqJavon');
    javon.innerHTML = tartib.map(function (a, i) {
      var foiz = Math.round(100 * a.progress / a.goal);
      return '<div class="yutuq' + (a.unlocked ? '' : ' yopiq') + '"' + (i >= KO_RINADI ? ' hidden' : '') +
        ' aria-label="' + UI.esc(a.title + ' — ' + (a.unlocked ? 'olingan' : 'hali olinmagan')) + '">' +
        '<span class="yutuq-belgi">' + UI.nishon(a.unlocked ? a.icon : 'lock') + '</span>' +
        '<b>' + UI.esc(a.title) + '</b>' +
        '<small>' + UI.esc(a.desc) + '</small>' +
        (!a.unlocked && a.goal > 1
          ? '<span class="yutuq-progress" role="img" aria-label="' + a.progress + ' / ' + a.goal + '"><i style="width:' + foiz + '%"></i></span>' +
            '<small>' + a.progress + ' / ' + a.goal + '</small>'
          : '') +
        '</div>';
    }).join('');
    var bo_lim = document.getElementById('yutuqlar');
    var hammasi = document.getElementById('yutuqHammasi');
    if (tartib.length > KO_RINADI) {
      hammasi.hidden = false;
      hammasi.textContent = 'Hammasini ko\'rish (' + tartib.length + ')';
      hammasi.onclick = function () {
        javon.querySelectorAll('.yutuq[hidden]').forEach(function (e) { e.hidden = false; });
        hammasi.hidden = true;
      };
    }
    bo_lim.hidden = false;
    if (location.hash === '#yutuqlar') bo_lim.scrollIntoView();
    orbitaChiz(y.items, y.pinned || []);
  });

  // Avatar atrofidagi nishonlar (Telegram sovg'alari kabi suzib turadi): Sozlamalarda
  // tanlanganlari, tanlanmagan bo'lsa — eng so'nggi olinganlari.
  // Joylar avatar markaziga nisbatan: x, y, o'lcham — birinchi nishon eng katta joyda.
  var ORBITA = [
    [-72, -30, 36], [74, -26, 34], [-104, 8, 30], [104, 12, 30], [-78, 36, 24], [80, 38, 24],
  ];
  function orbitaChiz(items, tanlangan) {
    var byKey = {};
    items.forEach(function (a) { byKey[a.key] = a; });
    var olingan = tanlangan.length
      ? tanlangan.map(function (k) { return byKey[k]; }).filter(Boolean)
      : items.filter(function (a) { return a.unlocked; })
          .sort(function (p, q) { return q.unlocked_ms - p.unlocked_ms; });
    olingan = olingan.slice(0, ORBITA.length);
    var orbita = document.getElementById('avatarOrbita');
    olingan.forEach(function (a, i) {
      var j = ORBITA[i];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'yutuq-belgi orbita-nishon';
      b.style.cssText = '--x:' + j[0] + 'px;--y:' + j[1] + 'px;--s:' + j[2] + 'px;--d:' + (i * 0.12).toFixed(2) + 's';
      b.setAttribute('aria-label', 'Nishon: ' + a.title);
      b.innerHTML = UI.nishon(a.icon);
      b.onclick = function () { UI.xabar(a.title + ' — ' + a.desc); };
      orbita.appendChild(b);
    });
  }

  // ── Hamkorlik ──
  function sanaQisqa(ms) {
    var d = new Date(ms);
    return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
  }
  function nusxaOl(matn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(matn).then(function () { return true; }, function () { return eskiNusxa(matn); });
    }
    return Promise.resolve(eskiNusxa(matn));
  }
  function eskiNusxa(matn) {
    var t = document.createElement('textarea');
    t.value = matn;
    t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t);
    t.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { /* */ }
    t.remove();
    return ok;
  }

  API.hamkor().then(function (r) {
    if (!r.ok || !r.partner) return;
    var h = r.partner;
    var matn = (window.I18N && I18N.til === 'ru') ? h.share.ru : h.share.uz;
    var stat = function (b, s, cls) {
      return '<div class="stat' + (cls ? ' ' + cls : '') + '"><b>' + UI.esc(b) + '</b><span>' + UI.esc(s) + '</span></div>';
    };
    var pogona = '';
    if (h.next_tier) {
      var oldingi = h.next_tier.at - h.next_tier.sales_left;
      pogona = '<div class="hk-pogona"><span>Yana ' + h.next_tier.sales_left + ' ta sotuv — komissiyangiz ' +
        h.next_tier.percent + '% bo\'ladi.</span>' +
        '<div class="progress" role="img" aria-label="' + oldingi + ' / ' + h.next_tier.at + '"><i style="width:' +
        Math.round(100 * oldingi / h.next_tier.at) + '%"></i></div></div>';
    }
    var sotuvlar = h.sales_list.length
      ? '<div class="hk-royxat"><h3>Oxirgi sotuvlar</h3>' + h.sales_list.map(function (x) {
          return '<div class="hk-qator"><span>' + UI.esc(x.item) + '<small>' + sanaQisqa(x.created_ms) + ' • ' +
            UI.pul(x.paid) + '</small></span><span class="plus">+' + UI.pul(x.amount) + '</span></div>';
        }).join('') + '</div>'
      : '<p class="izoh-kichik" style="margin-top:12px">Hali sotuv yo\'q. Kodingizni do\'stlaringiz va sinfdoshlaringizga ulashing!</p>';
    var tolovlar = h.payouts.length
      ? '<div class="hk-royxat"><h3>Sizga to\'langan</h3>' + h.payouts.map(function (x) {
          return '<div class="hk-qator"><span>' + sanaQisqa(x.created_ms) +
            (x.note ? '<small translate="no">' + UI.esc(x.note) + '</small>' : '') + '</span><span class="minus">' +
            UI.pul(x.amount) + '</span></div>';
        }).join('') + '</div>'
      : '';
    document.getElementById('hamkorHolat').textContent = h.active ? 'Faol' : 'To\'xtatilgan';
    document.getElementById('hamkorTana').innerHTML =
      '<div class="hk-kod"><div><small>Promo-kodingiz</small><b translate="no">' + UI.esc(h.code) + '</b></div>' +
        '<div class="hk-foiz">Sizga: <strong>' + h.percent_now + '%</strong><br>' +
        (h.discount ? 'Do\'stingizga: −' + h.discount + '%' : 'Har bir xariddan') + '</div></div>' +
      (h.active ? '' : '<div class="hk-toxtatilgan">Kodingiz vaqtincha to\'xtatilgan. Savolingiz bo\'lsa, botga yozing.</div>') +
      '<div class="hk-stat">' +
        stat(String(h.sales), 'Sotuvlar') + stat(UI.pul(h.earned), 'Jami ishlangan') +
        stat(UI.pul(h.paid), 'To\'langan') + stat(UI.pul(h.due), 'To\'lanishi kerak', 'asosiy') +
      '</div>' + pogona +
      '<div class="hk-matn" translate="no" id="hamkorMatn"></div>' +
      '<div class="tugmalar" style="margin-top:10px">' +
        '<button class="tugma" type="button" id="hamkorUlash">' + UI.nishon('send') + '<span>Ulashish</span></button>' +
        '<button class="tugma tugma-ikkilamchi" type="button" id="hamkorNusxa">Nusxa olish</button>' +
      '</div>' +
      sotuvlar + tolovlar +
      '<p class="izoh-kichik" style="margin-top:12px">Komissiya do\'stingiz kodingiz bilan xarid qilib, admin to\'lovni ' +
        'tasdiqlaganda yoziladi. Pulni admin o\'zi o\'tkazib beradi — har bir sotuv va to\'lov haqida botga xabar keladi.</p>';
    document.getElementById('hamkorMatn').textContent = matn;
    document.getElementById('hamkorUlash').onclick = function () {
      var url = 'https://t.me/share/url?url=' + encodeURIComponent(h.link) + '&text=' +
        encodeURIComponent(matn.replace('\n👉 ' + h.link, '').replace('👉 ' + h.link, ''));
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initData && tg.openTelegramLink) tg.openTelegramLink(url);
      else if (navigator.share) navigator.share({ title: 'BilimSari', text: matn }).catch(function () {});
      else window.open(url, '_blank', 'noopener');
    };
    document.getElementById('hamkorNusxa').onclick = function () {
      nusxaOl(matn).then(function (ok) { UI.xabar(ok ? 'Nusxa olindi' : 'Nusxa olib bo\'lmadi', ok ? 'muvaffaqiyat' : 'xato'); });
    };
    var bolim = document.getElementById('hamkor');
    bolim.hidden = false;
    if (location.hash === '#hamkor') bolim.scrollIntoView();
  });

  API.get('/api/games/me').then(function (g) {
    if (!g.ok) return;
    var o = g.stats;
    var tana = document.getElementById('oyinTana');
    document.getElementById('oyinBolim').hidden = false;
    if (!o.games) {
      tana.innerHTML = '<p class="izoh">Hali o\'yin o\'ynamagansiz. Do\'stlaringiz bilan bilim bellashuvida ' +
        'ball va chaqmoq to\'plang!</p>';
      return;
    }
    var stat = function (b, s) { return '<div class="stat"><b>' + UI.esc(b) + '</b><span>' + UI.esc(s) + '</span></div>'; };
    var izoh = ['Daraja ' + o.level];
    var m = o.medals || {};
    if (m.gold || m.silver || m.bronze) {
      izoh.push('Turnir medallari: ' + [[m.gold, 'oltin'], [m.silver, 'kumush'], [m.bronze, 'bronza']]
        .filter(function (x) { return x[0]; }).map(function (x) { return x[0] + ' ' + x[1]; }).join(', '));
    }
    if (o.favorite_subjects.length) izoh.push('Sevimli fanlar: ' + o.favorite_subjects.join(', '));
    if (o.streak) izoh.push('Ketma-ket ' + o.streak + ' kun');
    tana.innerHTML =
      '<div class="stat-setka stat-setka-4">' + stat(o.games, "O'yin") + stat(o.wins, "G'alaba") +
        stat(o.accuracy + '%', 'Aniqlik') + stat(o.xp, 'Ball') + '</div>' +
      '<p class="izoh" style="margin:10px 0">' + UI.esc(izoh.join(' • ')) + '</p>' +
      o.subjects.map(function (s) {
        return '<div class="progress-qator" style="margin-bottom:8px">' +
          '<span style="min-width:96px;color:var(--matn)">' + UI.esc(s.name) + '</span>' +
          '<div class="progress" role="img" aria-label="' + UI.esc(s.name) + ': ' + s.accuracy + '% aniqlik"><i style="width:' + s.accuracy + '%"></i></div>' +
          '<span>' + s.accuracy + '%</span></div>';
      }).join('');
  });
})();
</script>
</body>
</html>
