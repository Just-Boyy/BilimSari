<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — BilimSari</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BilimSari">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/apple-touch-icon-120.png">
  <meta name="theme-color" content="#58A700">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f2f2f2;color:#3c3c3c;padding-bottom:80px}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:560px;margin:0 auto;padding:24px 16px}
    .hero{background:#fff;border:2px solid #e5e5e5;border-radius:20px;padding:28px 20px;text-align:center;margin-bottom:16px}
    .avatar{width:80px;height:80px;border-radius:50%;background:#d7ffb8;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;border:3px solid #58A700;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .hero h1{font-size:22px;font-weight:800}
    .hero .lvl{color:#58A700;font-weight:800;margin-top:4px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .stat{background:#fff;border:2px solid #e5e5e5;border-radius:16px;padding:16px;text-align:center}
    .stat b{display:block;font-size:22px;color:#58A700}
    .stat span{font-size:12px;color:#afafaf;font-weight:700;text-transform:uppercase}
    .section{background:#fff;border:2px solid #e5e5e5;border-radius:16px;padding:16px;margin-bottom:16px}
    .section h2{font-size:16px;font-weight:800;margin-bottom:12px}
    .ach{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-weight:600;font-size:14px}
    .ach:last-child{border:none}
    .ach.off{opacity:.4}
    .logout{width:100%;height:48px;border:2px solid #ffdfe0;background:#fff;color:#FF4B4B;border-radius:14px;font-weight:800;cursor:pointer;margin-top:8px}
    .bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #e5e5e5;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:50}
    .bnav-inner{max-width:480px;width:100%;display:flex;justify-content:space-around}
    .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;font-size:11px;font-weight:700;color:#afafaf}
    .bnav a.active{color:#58A700}
    .bnav a span{font-size:22px}.nav-ico{display:flex;align-items:center;justify-content:center;height:24px}.nav-ico svg{width:22px;height:22px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="avatar" id="avIcon"></div>
      <h1 id="name">O‘quvchi</h1>
      <div class="lvl" id="lvl">Daraja 1</div>
    </div>
    <div class="grid">
      <div class="stat"><b id="xp">0</b><span>XP</span></div>
      <div class="stat"><b id="streak">0</b><span>Streak</span></div>
      <div class="stat"><b id="lessons">0</b><span>Darslar</span></div>
      <div class="stat"><b id="gems">0</b><span>Olmos</span></div>
    </div>
    <div class="section">
      <h2>Yutuqlar</h2>
      <div id="achs"></div>
    </div>
    <button class="logout" onclick="logout()">Chiqish</button>
  </div>
  <nav class="bnav"><div class="bnav-inner">
    <a href="learn.html"><span class="nav-ico" data-icon="home"></span data-i18n="learn">O‘rganish</a>
    <a href="courses.html"><span class="nav-ico" data-icon="book"></span data-i18n="courses">Kurslar</a>
    <a href="leaderboard.html"><span class="nav-ico" data-icon="trophy"></span data-i18n="rating">Reyting</a>
    <a href="review.html"><span class="nav-ico" data-icon="refresh"></span data-i18n="review">Takrorlash</a>
    <a href="profile.html" class="active"><span class="nav-ico" data-icon="user"></span data-i18n="profile">Profil</a>
  </div></nav>
  <script src="js/icons.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/game.js"></script>
  <script>
    (async function () {
      if (window.BilimSariTG && BilimSariTG.autoAuthIfTelegram) {
        await BilimSariTG.autoAuthIfTelegram();
      }
      await ensureSession();
    document.querySelectorAll('.nav-ico').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
    const session = getSession();
    const g = getGame();
    const av = document.getElementById('avIcon');
    let photo = session && session.photo_url;
    // Telegramdan yangilab olish
    if (window.BilimSariTG && BilimSariTG.getTelegramUser) {
      const tu = BilimSariTG.getTelegramUser();
      if (tu && tu.photo_url) photo = tu.photo_url;
    }
    if (photo) {
      av.innerHTML = '<img src="' + photo + '" alt="Profil" referrerpolicy="no-referrer">';
    } else {
      av.innerHTML = (typeof icon === 'function') ? icon('user') : '';
    }
    document.getElementById('name').textContent = (session && session.name) || 'O‘quvchi';
    document.getElementById('lvl').textContent = 'Daraja ' + levelFromXp(g.xp);
    document.getElementById('xp').textContent = g.xp;
    document.getElementById('streak').textContent = g.streak;
    document.getElementById('lessons').textContent = Object.values(g.completedLessons).flat().length;
    document.getElementById('gems').textContent = g.gems;
    const ACH = [
      {id:'streak_7',icon:'flame',title:'7 kunlik streak'},
      {id:'streak_30',icon:'flame',title:'30 kunlik streak'},
      {id:'xp_1000',icon:'zap',title:'1000 XP'},
      {id:'xp_5000',icon:'zap',title:'5000 XP'},
      {id:'lessons_10',icon:'book',title:'10 ta dars'},
      {id:'lessons_50',icon:'book',title:'50 ta dars'},
    ];
    const box = document.getElementById('achs');
    ACH.forEach(a => {
      const on = g.achievements.includes(a.id);
      const d = document.createElement('div');
      d.className = 'ach' + (on ? '' : ' off');
      d.innerHTML = `<span style="display:inline-flex;color:${on?'#58A700':'#ccc'}">${icon(a.icon)}</span> ${a.title} ${on?'✓':''}`;
      box.appendChild(d);
    });
    })();
  </script>
<script>if(window.BS_I18N)BS_I18N.apply(document);</script>
</body>
</html>
