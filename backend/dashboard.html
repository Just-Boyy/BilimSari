<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Bosh sahifa — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/i18n.js"></script>
</head>
<body>

<header class="shapka shapka-qotgan">
  <div class="shapka-qator">
    <!-- Salomlashuv, streak va reytingdagi o'rin (profil rasmi bu yerda ko'rsatilmaydi) -->
    <a class="bosh-profil" href="profile.html" aria-label="Profil">
      <span class="bosh-matn">
        <span class="salom" id="salom">Salom!</span>
        <span class="bosh-qator" id="boshQator"></span>
      </span>
    </a>
    <button class="chaqmoq-belgi" id="chaqmoqBelgi" type="button" aria-label="Chaqmoq haqida" hidden></button>
  </div>
</header>

<main class="sahifa sahifa-keng bosh-sahifa">
  <!-- Do'stlarning o'yinga chaqiruvlari -->
  <div id="dostChaqiruv"></div>
  <!-- Yutuqli marafon (bo'lsa) -->
  <div id="marafonBanner"></div>

  <!-- Tezkor tugmalar -->
  <section class="bo-lim">
    <nav class="tezkor" aria-label="Tezkor o'tish" id="tezkor"></nav>
  </section>

  <section class="bo-lim" id="kunBo-lim" hidden></section>

  <section class="bo-lim" id="rejaBo-lim" hidden></section>

  <section class="bo-lim" id="fanBo-lim" hidden>
    <div class="bo-lim-bosh">
      <h2>Mening fanlarim</h2>
      <a href="subjects.html" class="izoh" style="font-weight:600">Hammasi</a>
    </div>
    <div class="fanlar" id="fanlar"></div>
  </section>

  <section class="bo-lim" id="qulfBo-lim" hidden>
    <div class="bo-lim-bosh">
      <h2>Boshqa fanlar</h2>
    </div>
    <div class="fanlar" id="qulfFanlar"></div>
  </section>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  if (!(await UI.sessiyaKerak())) return;
  UI.navChiz('dashboard.html');

  // Yutuqli marafon banneri: sovrin jamg'armasi, taymer, o'rnim
  API.marafonBanner().then(function (r) {
    var b = r.ok && r.banner;
    if (!b) return;
    var farq = b.now - Date.now();
    var pul = function (n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm"; };
    var joy = document.getElementById('marafonBanner');
    joy.innerHTML = '<a class="marafon-banner" href="leaderboard.html?tab=marafon">' +
      '<span class="marafon-banner-belgi">' + UI.nishon('flame') + '</span>' +
      '<span class="marafon-banner-matn"><b>' + UI.esc(b.title) + '</b>' +
        (b.prize_fund ? '<small>Sovrin jamg\'armasi: ' + pul(b.prize_fund) + '</small>' : '') +
        '<small>' + (b.status === 'scheduled' ? 'Boshlanishiga:' : 'Tugashiga:') + ' <span id="marafonBannerTaymer"></span></small></span>' +
      '<span class="marafon-banner-ong">' + (b.joined && b.rank
        ? '<b>' + b.rank + '</b><small>o\'rin</small>' : '<em>' + (b.joined ? 'Qatnashyapsiz' : 'Qatnashish') + ' ›</em>') + '</span></a>';
    function taymer() {
      var el = document.getElementById('marafonBannerTaymer');
      if (!el) return;
      var s = Math.max(0, Math.floor(((b.status === 'scheduled' ? b.start_ms : b.end_ms) - Date.now() - farq) / 1000));
      var kun = Math.floor(s / 86400);
      el.textContent = (kun ? kun + ' kun ' : '') + UI.vaqtRaqam(s % 86400);
    }
    taymer();
    setInterval(taymer, 1000);
  });

  // Do'st o'yinga chaqirgan bo'lsa — yuqorida banner
  API.dostChaqiruvlar().then(function (r) {
    if (!r.ok || !r.invites.length) return;
    document.getElementById('dostChaqiruv').innerHTML = r.invites.slice(0, 2).map(function (i) {
      return '<div class="dost-chaqiruv"><p>🎮 ' + UI.esc(i.from.name) + ' sizni «' + UI.esc(i.game) + '» o\'yiniga chaqirdi</p>' +
        '<a class="tugma" href="games.html?kod=' + encodeURIComponent(i.code) + '">Qo\'shilish</a></div>';
    }).join('');
  });

  function salomlashuv() {
    var soat = new Date().getHours();
    if (soat < 6) return 'Xayrli tun';
    if (soat < 12) return 'Xayrli tong';
    if (soat < 18) return 'Xayrli kun';
    return 'Xayrli kech';
  }

  async function yukla() {
    var res = await API.dashboard();

    if (!res.ok) {
      UI.xabar(res.error, 'xato');
      return;
    }
    if (res.needs_onboarding) { location.href = 'onboarding.html'; return; }

    oxirgi = res;
    sarlavhaChiz(res);
    kunChiz(res.daily);
    rejaChiz(res.plan, res.today, res.daily && res.daily.day);
    fanChiz(res.subjects);
    UI.yutuqTabrik(res.new_achievements);
    shaxsiyXabar(res.personal_news);
  }

  // Tayyor bo'lgan (yoki yaratilmay qolgan) shaxsiy darslar — bir martalik xabar
  function shaxsiyXabar(yangilar) {
    if (!yangilar || !yangilar.length) return;
    var tayyor = yangilar.filter(function (x) { return x.status === 'ready'; });
    if (tayyor.length) UI.xabar('«' + tayyor[0].title + '» shaxsiy darslaringizga qo\'shildi', 'muvaffaqiyat');
    else UI.xabar('«' + yangilar[0].title + '» darsini tayyorlab bo\'lmadi. Qayta urinib ko\'ring.', 'xato');
    API.shaxsiyKorildi(yangilar.map(function (x) { return x.id; }));
  }

  var oxirgi = null;
  var taymer = null;

  function avatarHtml(nom, rasm, cls) {
    return rasm
      ? '<img class="avatar' + (cls ? ' ' + cls : '') + '" alt="" src="' + UI.esc(rasm) + '">'
      : '<span class="avatar' + (cls ? ' ' + cls : '') + '">' + UI.esc(UI.harfAvatar(nom)) + '</span>';
  }

  // ── Sarlavha: salomlashuv (ism + emoji), streak va reytingdagi o'rin, chaqmoq ──
  function sarlavhaChiz(res) {
    var u = res.user || {};
    var ism = UI.bosh(u.name);
    var pr = u.premium || {};
    var salom = document.getElementById('salom');
    salom.innerHTML = '<span>' + UI.esc(salomlashuv() + ', ' + ism + '!') + '</span>' + UI.emoji(pr.active && pr.emoji);

    var qator = [];
    if (res.streak > 0) {
      qator.push('<span class="olov">' + UI.nishon('flame') + '<span>' + res.streak + ' kun</span></span>');
    }
    if (res.rank && res.rank.rank) {
      qator.push('<span class="kubok">' + UI.nishon('trophy') + '<span>' + res.rank.rank + '-o\'rin</span></span>');
    }
    document.getElementById('boshQator').innerHTML = qator.join('');

    var belgi = document.getElementById('chaqmoqBelgi');
    belgi.innerHTML = UI.nishon('chaqmoq', 'nishon') + '<span class="son">' + (res.chaqmoq || 0) + '</span>';
    belgi.hidden = false;
    belgi.onclick = chaqmoqOyna;
  }

  // ── Chaqmoq belgisi bosilganda: qayerdan yig'ilgani va reytingdagi o'rin ──
  function chaqmoqOyna() {
    var res = oxirgi;
    if (!res || document.getElementById('chaqmoqOyna')) return;
    var q = res.chaqmoq_parts || { topics: 0, games: 0, daily: 0 };
    var manba = function (ikon, nom, izoh, son) {
      return '<div><span class="nishon-doira">' + UI.nishon(ikon) + '</span>' +
        '<span>' + nom + '<small>' + izoh + '</small></span><b>+' + son + '</b></div>';
    };
    var oyna = document.createElement('div');
    oyna.id = 'chaqmoqOyna';
    oyna.className = 'pastki-oyna';
    oyna.innerHTML =
      '<div class="pastki-oyna-karta" role="dialog" aria-modal="true" aria-labelledby="chaqmoqSarlavha">' +
        '<div class="chaqmoq-katta"><span class="belgi">' + UI.nishon('chaqmoq') + '</span>' +
          '<b id="chaqmoqSarlavha">' + (res.chaqmoq || 0) + ' chaqmoq</b></div>' +
        '<p class="izoh">' + (res.rank && res.rank.rank
          ? 'Reytingda <b>' + res.rank.rank + '-o\'rin</b> (' + res.rank.total + ' o\'quvchi orasida)'
          : 'Chaqmoq to\'plab reytingga chiqing!') + '</p>' +
        '<div class="chaqmoq-manba">' +
          manba('bookOpen', 'Darslar', 'Testda har to\'g\'ri javob +5 (1-urinish), uy vazifasi +15', q.topics) +
          manba('gamepad', 'O\'yinlar', 'O\'yinda har 10 ball +1', q.games) +
          manba('sparkle', 'Kun savoli', 'To\'g\'ri javob +5', q.daily) +
        '</div>' +
        '<a class="tugma" href="leaderboard.html">Reytingni ochish</a>' +
        '<button class="matn-tugma" type="button" data-yop style="display:block;margin:10px auto 0">Yopish</button>' +
      '</div>';
    function yop() {
      oyna.remove();
      document.removeEventListener('keydown', tugma);
    }
    function tugma(e) { if (e.key === 'Escape') yop(); }
    oyna.onclick = function (e) { if (e.target === oyna || e.target.hasAttribute('data-yop')) yop(); };
    document.addEventListener('keydown', tugma);
    document.body.appendChild(oyna);
    oyna.querySelector('[data-yop]').focus();
  }

  // ── Tezkor tugmalar ──
  document.getElementById('tezkor').innerHTML = [
    ['daily.html', 'sparkle', 'Kun savoli', '#fff7ed', '#ea580c'],
    ['games.html', 'gamepad', 'O\'yin', '#f5f3ff', '#7c3aed'],
    ['game.html', 'dumbbell', 'Mashq', '#e0f2fe', '#0284c7'],
    ['leaderboard.html', 'trophy', 'Reyting', '#fefce8', '#ca8a04'],
  ].map(function (t) {
    return '<a href="' + t[0] + '"><span class="doira" style="--doira-fon:' + t[3] + ';--doira-rang:' + t[4] + '">' +
      UI.nishon(t[1]) + '</span>' + t[2] + '</a>';
  }).join('');

  function vaqt(s) {
    s = Math.max(0, s);
    var ikki = function (n) { return (n < 10 ? '0' : '') + n; };
    return ikki(Math.floor(s / 3600)) + ':' + ikki(Math.floor(s % 3600 / 60)) + ':' + ikki(s % 60);
  }

  // ── Kun savoli kartasi: holatga mos rang, taymer, mini reyting, hafta taqvimi ──
  function kunChiz(kun) {
    var bo_lim = document.getElementById('kunBo-lim');
    clearInterval(taymer);
    if (!kun) { bo_lim.hidden = true; return; }
    var holat = !kun.answered ? 'kutilmoqda' : (kun.correct ? 'togri' : 'xato');

    var tana;
    if (holat === 'kutilmoqda') {
      tana = '<h3 class="kun-sarlavha">Bugungi savol tayyor!</h3>' +
        '<p class="kun-izoh">To\'g\'ri va tez javob bering — +5 chaqmoq va kunlik reyting.</p>' +
        '<span class="kun-tugma">Savolni ochish' + UI.nishon('chevronRight') + '</span>';
    } else {
      var sarlavha = kun.correct
        ? 'To\'g\'ri javob!' + (kun.my_rank ? ' ' + kun.my_rank + '-o\'rin' : '')
        : 'Bugun adashdingiz';
      tana = '<div class="kun-holat"><span class="belgi">' + UI.nishon(kun.correct ? 'check' : 'x') + '</span>' +
        '<span><b>' + sarlavha + '</b><small>Keyingi savol: <span class="kun-taymer" id="kunTaymer">' +
          vaqt(kun.next_in_s) + '</span></small></span></div>';
    }

    var reyting = '';
    if (kun.answered_count > 0) {
      reyting = '<div class="kun-reyting">' +
        (kun.top && kun.top.length
          ? '<span class="kun-avatarlar">' + kun.top.map(function (t) { return avatarHtml(t.name, t.photo_url); }).join('') + '</span>'
          : '') +
        '<span>Bugun ' + kun.answered_count + ' kishi javob berdi' +
          (kun.my_rank ? ', <span style="white-space:nowrap">siz ' + kun.my_rank + '-o\'rindasiz</span>' : '') +
        '</span></div>';
    }

    var hafta = '<div class="kun-hafta" aria-label="Shu haftadagi kun savollari">' + (kun.week || []).map(function (d) {
      var cls = 'kun-kun' + (d.answered ? ' bor' : '') + (d.correct ? ' togri' : '') +
        (d.today ? ' bugun' : '') + (d.future ? ' kelajak' : '');
      return '<span class="' + cls + '"><i>' + (d.answered ? UI.nishon('flame') : '') + '</i>' + d.label + '</span>';
    }).join('') + '</div>';

    bo_lim.innerHTML =
      '<a class="kun-karta ' + holat + '" href="daily.html">' +
        '<div class="kun-tepa"><span class="kun-yorliq">' + UI.nishon('sparkle') + 'Kun savoli</span>' +
          (kun.streak > 0 ? '<span class="kun-streak">' + UI.nishon('flame') + kun.streak + '</span>' : '') + '</div>' +
        tana + reyting + hafta +
      '</a>';
    bo_lim.hidden = false;

    // Keyingi savolgacha jonli taymer; vaqt tugasa — yangi savol bilan qayta yuklanadi
    var el = document.getElementById('kunTaymer');
    if (el) {
      var tugash = Date.now() + kun.next_in_s * 1000;
      taymer = setInterval(function () {
        var qoldi = Math.round((tugash - Date.now()) / 1000);
        el.textContent = vaqt(qoldi);
        if (qoldi <= 0) { clearInterval(taymer); setTimeout(yukla, 1500); }
      }, 1000);
    }
  }

  // ── Bugungi reja: kun savoli, 1 ta mavzu, 1 ta o'yin ──
  function rejaChiz(reja, bugun, kun) {
    var bo_lim = document.getElementById('rejaBo-lim');
    if (!reja) { bo_lim.hidden = true; return; }
    var mavzuYo_l = bugun ? 'topics.html?fan=' + encodeURIComponent(bugun.subject_key) : 'subjects.html';
    var vazifa = function (bajarildi, yo_l, matn) {
      return '<a class="reja-vazifa' + (bajarildi ? ' bajarildi' : '') + '" href="' + yo_l + '">' +
        '<span class="reja-check">' + UI.nishon('check') + '</span><span>' + matn + '</span>' +
        UI.nishon('chevronRight') + '</a>';
    };
    var hammasi = reja.done >= reja.total;
    bo_lim.innerHTML =
      '<div class="karta reja-karta' + (hammasi ? ' hammasi' : '') + '">' +
        '<div class="reja-bosh"><h2>Bugungi reja</h2><span class="reja-son">' + reja.done + ' / ' + reja.total + '</span></div>' +
        '<div class="reja-chiziq" role="img" aria-label="' + reja.done + ' / ' + reja.total + ' bajarildi">' +
          '<i style="width:' + Math.round(100 * reja.done / reja.total) + '%"></i></div>' +
        (hammasi ? '<p class="reja-tabrik">' + UI.nishon('party') + 'Barakalla! Bugungi reja bajarildi.</p>' : '') +
        vazifa(reja.daily, 'daily.html', 'Kun savoliga javob berish') +
        vazifa(reja.topic, mavzuYo_l, '1 ta mavzuni tugatish') +
        vazifa(reja.game, 'games.html', '1 ta o\'yin o\'ynash') +
      '</div>';
    bo_lim.hidden = false;

    // Reja to'liq bajarilgan kuni bir marta tabrik
    if (hammasi && kun) {
      var kalit = 'bs_reja_' + kun;
      var avval = null;
      try { avval = localStorage.getItem(kalit); } catch (e) { /* xotira yo'q */ }
      if (!avval) {
        try { localStorage.setItem(kalit, '1'); } catch (e) { /* xotira yo'q */ }
        UI.xabar('Barakalla! Bugungi reja to\'liq bajarildi', 'muvaffaqiyat');
        try { Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch (e) { /* brauzerda yo'q */ }
      }
    }
  }

  // ── Fan kartasi HTML'i (ochilgan va qulflangan uchun umumiy) ──
  function fanKartaHtml(f) {
    var holat = f.finished
      ? 'Hamma mavzu tugallandi'
      : (f.current_topic
          ? (f.current_topic.state === 'cooldown' ? 'Keyingi: ' : 'Hozir: ') +
            UI.esc(f.current_topic.title)
          : 'Boshlanmagan');
    var halqa = (!f.locked && !f.finished && f.percent > 0)
      ? '<span class="fan-halqa" style="--foiz:' + f.percent + '%"><span>' + f.percent + '%</span></span>'
      : '';
    return '<a class="fan' + (f.finished ? ' tugagan' : '') + (f.image ? ' fan-rasmli' : '') + (f.locked ? ' qulflangan' : '') + '"' +
      ' href="' + (f.locked ? 'shop.html' : 'topics.html') + '?fan=' + encodeURIComponent(f.key) + '"' +
      ' style="' + (f.image
        ? "background-image:url('" + UI.esc(f.image) + "')"
        : 'border-left-color:' + UI.esc(f.color)) + '">' +
      (f.locked ? '<span class="fan-qulf">' + UI.nishon('lock') + '</span>' : halqa) +
      (f.image ? '' : '<span class="belgi">' + UI.fanBelgi(f.image, f.icon) + '</span>') +
      '<h3>' + UI.esc(f.name) + '</h3>' +
      '<p class="holat">' + (f.locked ? UI.esc(UI.qulfHolat(f)) : holat) + '</p>' +
      (f.locked ? '' :
        '<div class="progress"><i style="width:' + f.percent + '%;background:' +
          UI.esc(f.color) + '"></i></div>' +
        '<p class="foiz">' + f.completed_topics + ' / ' + f.total_topics + ' mavzu</p>') +
      '</a>';
  }

  // ── Fanlar: ochilgan va qulflangan alohida bo'limlarda ──
  function fanChiz(fanlar) {
    var ochiqBo_lim = document.getElementById('fanBo-lim');
    var qulfBo_lim = document.getElementById('qulfBo-lim');
    var ochiqQuti = document.getElementById('fanlar');
    var qulfQuti = document.getElementById('qulfFanlar');

    if (!fanlar || !fanlar.length) {
      ochiqBo_lim.hidden = false;
      qulfBo_lim.hidden = true;
      ochiqQuti.style.gridTemplateColumns = '1fr';
      ochiqQuti.innerHTML = UI.holat({
        belgi: 'tools',
        sarlavha: 'Fanlar tayyorlanmoqda',
        matn: 'Darslar hali qo\'shilmagan.',
      });
      return;
    }

    var ochiq = fanlar.filter(function (f) { return !f.locked; });
    var qulf = fanlar.filter(function (f) { return f.locked; });

    ochiqBo_lim.hidden = false;
    ochiqQuti.style.gridTemplateColumns = '';
    ochiqQuti.innerHTML = ochiq.map(fanKartaHtml).join('');

    if (qulf.length) {
      qulfBo_lim.hidden = false;
      qulfQuti.innerHTML = qulf.map(fanKartaHtml).join('');
    } else {
      qulfBo_lim.hidden = true;
    }
  }

  yukla();

  // Sahifaga qaytganda yangilash (kutish vaqti o'tgan bo'lishi mumkin)
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) yukla();
  });
})();
</script>
</body>
</html>
