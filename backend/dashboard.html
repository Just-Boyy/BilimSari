<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16283C">
<title>Bosh sahifa — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="shapka">
  <div class="shapka-qator">
    <div>
      <p class="salom" id="salom">Salom!</p>
      <span class="sinf" id="sinfYorliq" hidden></span>
    </div>
    <div class="avatar" id="avatar" aria-hidden="true"></div>
  </div>
</header>

<main class="sahifa sahifa-keng">
  <div class="ko-tarilgan" id="bugun">
    <div class="karta">
      <div class="skelet" style="height:22px;width:45%;margin-bottom:12px"></div>
      <div class="skelet" style="height:30px;width:75%;margin-bottom:10px"></div>
      <div class="skelet" style="height:50px"></div>
    </div>
  </div>

  <section class="bo-lim" id="statBo-lim" hidden>
    <div class="stat-setka" id="statlar"></div>
  </section>

  <section class="bo-lim" id="fanBo-lim" hidden>
    <div class="bo-lim-bosh">
      <h2>Mening fanlarim</h2>
      <a href="subjects.html" class="izoh" style="font-weight:600">Hammasi</a>
    </div>
    <div class="fanlar" id="fanlar"></div>
  </section>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  if (!(await UI.sessiyaKerak())) return;
  UI.navChiz('dashboard.html');

  var to_xtat = null;

  async function yukla() {
    var res = await API.dashboard();

    if (!res.ok) {
      document.getElementById('bugun').innerHTML = UI.xatoHolat(res.error, yukla);
      return;
    }
    if (res.needs_onboarding) { location.href = 'onboarding.html'; return; }

    // Sarlavha
    var ism = UI.bosh(res.user && res.user.name);
    document.getElementById('salom').textContent = 'Salom, ' + ism + '!';
    var yorliq = document.getElementById('sinfYorliq');
    yorliq.textContent = res.grade + '-sinf o\'quvchisi';
    yorliq.hidden = false;

    var av = document.getElementById('avatar');
    if (res.user && res.user.photo_url) {
      av.outerHTML = '<img class="avatar" id="avatar" alt="" src="' + UI.esc(res.user.photo_url) + '">';
    } else {
      av.textContent = UI.harfAvatar(ism);
    }

    bugunChiz(res);
    statChiz(res.stats);
    fanChiz(res.subjects);
  }

  // ── Bugungi dars yoki kutish ──
  function bugunChiz(res) {
    var quti = document.getElementById('bugun');
    if (to_xtat) { to_xtat(); to_xtat = null; }

    if (res.cooldown && res.cooldown.active) {
      quti.innerHTML =
        '<div class="kutish-karta">' +
          '<h2>Bugungi mavzuni yakunladingiz</h2>' +
          '<p>Keyingi mavzu quyidagi vaqtdan so\'ng ochiladi</p>' +
          '<div class="taymer" id="taymer" role="timer" aria-live="off">--:--:--</div>' +
          '<p class="izoh-kichik" style="color:rgba(255,255,255,.6)">' +
            UI.esc(res.cooldown.unlock_at_tashkent || '') + ' (Toshkent vaqti)</p>' +
        '</div>';
      to_xtat = UI.taymer(
        document.getElementById('taymer'),
        res.cooldown.seconds_left,
        function () { UI.xabar('Keyingi mavzu ochildi!', 'muvaffaqiyat'); yukla(); }
      );
      return;
    }

    if (!res.today) {
      quti.innerHTML = UI.holat({
        belgi: '🎉',
        sarlavha: 'Barcha mavzular tugallandi',
        matn: 'Ushbu sinf bo\'yicha hamma darsni yakunladingiz. Natijalaringizni ko\'ring.',
        tugma: 'Natijalarim', tugmaYo_l: 'progress.html',
      });
      return;
    }

    var t = res.today;
    quti.innerHTML =
      '<div class="karta bugun">' +
        '<div class="fan-qator">' +
          '<span class="belgi" aria-hidden="true">' + t.subject_icon + '</span>' +
          '<span>Bugungi dars — ' + UI.esc(t.subject_name) + '</span>' +
        '</div>' +
        '<h2>' + UI.esc(t.topic_title) + '</h2>' +
        '<p class="tavsif">Dars, test va uy vazifasi — hammasi bitta sahifada.</p>' +
        '<a class="tugma" href="topic.html?fan=' + encodeURIComponent(t.subject_key) +
          '&mavzu=' + encodeURIComponent(t.topic_slug) + '">Darsni boshlash</a>' +
      '</div>';
  }

  // ── Statistika ──
  function statChiz(s) {
    if (!s) return;
    document.getElementById('statlar').innerHTML =
      '<div class="stat"><b>' + s.completed_topics + '</b><span>Tugallangan mavzu</span></div>' +
      '<div class="stat"><b>' + s.percent + '%</b><span>Umumiy progress</span></div>' +
      '<div class="stat"><b>' + s.subjects_count + '</b><span>Fan</span></div>';
    document.getElementById('statBo-lim').hidden = false;
  }

  // ── Fanlar ──
  function fanChiz(fanlar) {
    var quti = document.getElementById('fanlar');
    document.getElementById('fanBo-lim').hidden = false;

    if (!fanlar || !fanlar.length) {
      quti.style.gridTemplateColumns = '1fr';
      quti.innerHTML = UI.holat({
        belgi: '🛠️',
        sarlavha: 'Fanlar tayyorlanmoqda',
        matn: 'Sizning sinfingiz uchun darslar hali qo\'shilmagan.',
        tugma: 'Sinfni o\'zgartirish', tugmaYo_l: 'onboarding.html',
      });
      return;
    }

    quti.innerHTML = fanlar.map(function (f) {
      var holat = f.finished
        ? 'Hamma mavzu tugallandi'
        : (f.current_topic
            ? (f.current_topic.state === 'cooldown' ? 'Keyingi: ' : 'Hozir: ') +
              UI.esc(f.current_topic.title)
            : 'Boshlanmagan');
      return '<a class="fan' + (f.finished ? ' tugagan' : '') + '"' +
        ' href="topics.html?fan=' + encodeURIComponent(f.key) + '"' +
        ' style="border-left-color:' + UI.esc(f.color) + '">' +
        '<span class="belgi" aria-hidden="true">' + f.icon + '</span>' +
        '<h3>' + UI.esc(f.name) + '</h3>' +
        '<p class="holat">' + holat + '</p>' +
        '<div class="progress"><i style="width:' + f.percent + '%;background:' +
          UI.esc(f.color) + '"></i></div>' +
        '<p class="foiz">' + f.completed_topics + ' / ' + f.total_topics + ' mavzu</p></a>';
    }).join('');
  }

  yukla();

  // Sahifaga qaytganda yangilash (kutish vaqti o'tgan bo'lishi mumkin)
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) yukla();
  });
})();
</script>
</body>
</html>
