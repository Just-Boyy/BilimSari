<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Bosh sahifa — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="shapka">
  <div class="shapka-qator">
    <div>
      <p class="salom" id="salom">Salom!</p>
    </div>
    <div class="avatar" id="avatar" aria-hidden="true"></div>
  </div>
</header>

<main class="sahifa sahifa-keng">
  <section class="bo-lim" id="yolBo-lim" hidden>
    <div class="bo-lim-bosh">
      <h2 id="yolFanNomi">Mavzular</h2>
      <a href="#" id="yolFanHavola" class="izoh" style="font-weight:600"></a>
    </div>
    <div id="yolRoyxat"></div>
  </section>

  <section class="bo-lim" id="fanBo-lim" hidden>
    <div class="bo-lim-bosh">
      <h2>Mening fanlarim</h2>
      <a href="subjects.html" class="izoh" style="font-weight:600">Hammasi</a>
    </div>
    <div class="fanlar" id="fanlar"></div>
  </section>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
(async function () {
  if (!(await UI.sessiyaKerak())) return;
  UI.navChiz('dashboard.html');

  async function yukla() {
    var res = await API.dashboard();

    if (!res.ok) {
      UI.xabar(res.error, 'xato');
      return;
    }
    if (res.needs_onboarding) { location.href = 'onboarding.html'; return; }

    // Sarlavha
    var ism = UI.bosh(res.user && res.user.name);
    document.getElementById('salom').textContent = 'Salom, ' + ism + '!';

    var av = document.getElementById('avatar');
    if (res.user && res.user.photo_url) {
      av.outerHTML = '<img class="avatar" id="avatar" alt="" src="' + UI.esc(res.user.photo_url) + '">';
    } else {
      av.textContent = UI.harfAvatar(ism);
    }

    yolChiz(res.today);
    fanChiz(res.subjects);
  }

  // ── Ochilgan fanning mavzular yo'li ──
  var YORLIQ = {
    completed: 'Tugallandi', current: 'Bugungi mavzu', cooldown: 'Kutishda', locked: 'Qulflangan',
  };
  function tugunIkon(holat, seq) {
    if (holat === 'completed') return UI.nishon('check');
    if (holat === 'locked') return UI.nishon('lock');
    if (holat === 'cooldown') return UI.nishon('clock');
    return String(seq);
  }

  async function yolChiz(today) {
    var bo_lim = document.getElementById('yolBo-lim');
    var royxat = document.getElementById('yolRoyxat');

    if (!today) {
      bo_lim.hidden = true;
      return;
    }

    bo_lim.hidden = false;
    document.getElementById('yolFanNomi').textContent = today.subject_name;
    var havola = document.getElementById('yolFanHavola');
    havola.href = 'topics.html?fan=' + encodeURIComponent(today.subject_key);
    havola.textContent = 'Hammasi';

    royxat.innerHTML = '<div class="skelet" style="height:90px;margin-bottom:14px"></div>';

    var res = await API.mavzular(today.subject_key);
    if (!res.ok) {
      royxat.innerHTML = UI.xatoHolat(res.error, function () { yolChiz(today); });
      return;
    }

    royxat.innerHTML = '<div class="yo-l">' + res.topics.map(function (m, i) {
      var raqam = i + 1;
      var sinf = { completed: 'tugallangan', current: 'joriy',
                   cooldown: 'kutish', locked: 'qulflangan' }[m.state];
      var tugun = tugunIkon(m.state, raqam);

      var ichki =
        '<span class="mavzu-tugun">' + tugun + '</span>' +
        '<h3>' + raqam + '. ' + UI.esc(m.title) + '</h3>' +
        '<p class="tavsif">' + UI.esc(m.summary) + '</p>' +
        '<span class="yorliq">' + YORLIQ[m.state] + '</span>';

      var ochiq = m.state === 'completed' || m.state === 'current';
      if (ochiq) {
        return '<a class="mavzu ' + sinf + '" href="topic.html?fan=' +
          encodeURIComponent(today.subject_key) + '&mavzu=' + encodeURIComponent(m.slug) +
          '&sinf=' + encodeURIComponent(m.grade) + '">' + ichki + '</a>';
      }
      var sabab = m.state === 'cooldown'
        ? 'Bu mavzu ' + UI.vaqtMatn(res.cooldown.seconds_left) + 'dan so\'ng ochiladi.'
        : 'Avval oldingi mavzuni yakunlang.';
      return '<div class="mavzu ' + sinf + '" role="button" tabindex="0"' +
        ' data-sabab="' + UI.esc(sabab) + '">' + ichki + '</div>';
    }).join('') + '</div>';

    royxat.querySelectorAll('[data-sabab]').forEach(function (el) {
      function ayt() { UI.xabar(el.dataset.sabab); }
      el.onclick = ayt;
      el.onkeydown = function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ayt(); }
      };
    });
  }

  // ── Fanlar ──
  function fanChiz(fanlar) {
    var quti = document.getElementById('fanlar');
    document.getElementById('fanBo-lim').hidden = false;

    if (!fanlar || !fanlar.length) {
      quti.style.gridTemplateColumns = '1fr';
      quti.innerHTML = UI.holat({
        belgi: 'tools',
        sarlavha: 'Fanlar tayyorlanmoqda',
        matn: 'Darslar hali qo\'shilmagan.',
      });
      return;
    }

    quti.innerHTML = fanlar.map(function (f) {
      var holat = f.finished
        ? 'Hamma mavzu tugallandi'
        : (f.current_topic
            ? (f.current_topic.state === 'cooldown' ? 'Keyingi: ' : 'Hozir: ') +
              UI.esc(f.current_topic.title)
            : 'Boshlanmagan');
      return '<a class="fan' + (f.finished ? ' tugagan' : '') + (f.image ? ' fan-rasmli' : '') + (f.locked ? ' qulflangan' : '') + '"' +
        ' href="topics.html?fan=' + encodeURIComponent(f.key) + '"' +
        ' style="' + (f.image
          ? "background-image:url('" + UI.esc(f.image) + "')"
          : 'border-left-color:' + UI.esc(f.color)) + '">' +
        (f.locked ? '<span class="fan-qulf">' + UI.nishon('lock') + '</span>' : '') +
        (f.image ? '' : '<span class="belgi">' + UI.fanBelgi(f.image, f.icon) + '</span>') +
        '<h3>' + UI.esc(f.name) + '</h3>' +
        '<p class="holat">' + (f.locked ? f.price.toLocaleString('uz-UZ') + ' so\'m' : holat) + '</p>' +
        (f.locked ? '' :
          '<div class="progress"><i style="width:' + f.percent + '%;background:' +
            UI.esc(f.color) + '"></i></div>' +
          '<p class="foiz">' + f.completed_topics + ' / ' + f.total_topics + ' mavzu</p>') +
        '</a>';
    }).join('');
  }

  yukla();

  // Sahifaga qaytganda yangilash (kutish vaqti o'tgan bo'lishi mumkin)
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) yukla();
  });
})();
</script>
</body>
</html>
