<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8FB">
<title>Ro'yxatdan o'tish — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="no-nav">

<main class="markaz">
  <div class="logo-qator">
    <span class="logo-belgi" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 72 72" fill="none" stroke="currentColor"
           stroke-width="3.4" stroke-linejoin="round">
        <path d="M36 6l8 14 16 2-12 11 3 16-15-8-15 8 3-16L12 22l16-2z"/>
      </svg>
    </span>
    <b>BilimSari</b>
  </div>

  <h1 style="margin-bottom:6px">Hisob yaratish</h1>
  <p class="izoh" style="margin-bottom:24px">
    Ro'yxatdan o'tgach sinfingizni tanlaysiz va darslar shunga moslanadi.
  </p>

  <form id="forma" novalidate>
    <div class="maydon">
      <label for="ism">Ismingiz</label>
      <input class="kiritish" type="text" id="ism" autocomplete="given-name"
             placeholder="Masalan: Dilnoza" required>
    </div>
    <div class="maydon">
      <label for="email">Email</label>
      <input class="kiritish" type="email" id="email" autocomplete="email"
             placeholder="ism@example.com" required>
    </div>
    <div class="maydon">
      <label for="parol">Parol</label>
      <input class="kiritish" type="password" id="parol" autocomplete="new-password"
             placeholder="Kamida 6 ta belgi" required>
      <p class="izoh-kichik" style="margin-top:6px">Parolni eslab qoling — kirishda kerak bo'ladi.</p>
    </div>
    <p id="xato" class="izoh" style="color:var(--qizil);min-height:1.4em;margin:0 0 12px"></p>
    <button class="tugma" type="submit" id="yubor">Ro'yxatdan o'tish</button>
  </form>

  <p class="izoh" style="text-align:center;margin-top:20px">
    Hisobingiz bormi? <a href="login.html"><b>Kiring</b></a>
  </p>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/telegram.js"></script>
<script>
document.getElementById('forma').onsubmit = async function (e) {
  e.preventDefault();
  var xato = document.getElementById('xato');
  var tugma = document.getElementById('yubor');
  var ism = document.getElementById('ism').value.trim();
  var email = document.getElementById('email').value.trim();
  var parol = document.getElementById('parol').value;

  xato.textContent = '';
  if (ism.length < 2) { xato.textContent = 'Ismingizni to\'liq yozing.'; return; }
  if (email.indexOf('@') < 0) { xato.textContent = 'Email manzilini to\'g\'ri kiriting.'; return; }
  if (parol.length < 6) { xato.textContent = 'Parol kamida 6 ta belgidan iborat bo\'lsin.'; return; }

  tugma.disabled = true;
  tugma.textContent = 'Yaratilmoqda...';

  var res = await API.ro_yxat(ism, email, parol);

  tugma.disabled = false;
  tugma.textContent = 'Ro\'yxatdan o\'tish';

  if (!res.ok) { xato.textContent = res.error; return; }

  API.sessiyaOchish(res.token, res.user);
  location.href = 'onboarding.html';
};
</script>
</body>
</html>
