<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58A700">
<title>Faqat Telegram orqali — BilimSari</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-icon-64.png">
<link rel="stylesheet" href="css/app.css">
<style>
  .tg-ekran {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
    max-width: 420px;
    margin: 0 auto;
  }
  .tg-ekran .nishon-katta {
    width: 76px; height: 76px;
    border-radius: 22px;
    margin: 0 auto 20px;
    box-shadow: 0 5px 0 var(--yashil-quyuq);
    overflow: hidden;
  }
  .tg-ekran .nishon-katta img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tg-ekran h1 { font-size: 22px; margin-bottom: 10px; }
  .tg-ekran p { color: var(--matn-2); font-size: 14px; margin-bottom: 26px; max-width: 32ch; }
  .tg-ekran .tugma { display: inline-flex; padding: 14px 28px; }
</style>
<script src="js/i18n.js"></script>
</head>
<body class="no-nav">

<main class="tg-ekran">
  <div class="nishon-katta"><img src="assets/logo-green.png" alt="Bilim Sari"></div>
  <h1>Faqat Telegram orqali ishlaydi</h1>
  <p>BilimSari — Telegram Mini App. Undan foydalanish uchun botni Telegram orqali oching.</p>
  <a class="tugma" href="https://t.me/bilimsaribot" id="botTugma">Botni ochish</a>
</main>

<script>
// Aslida Telegram ichidamiz (masalan, birinchi ochilishda internet sekin bo'lib shu sahifaga tushib qolgan
// bo'lsak) — ilovaga o'zi qaytadi; qayta-qayta aylanmasligi uchun 20 soniyada ko'pi bilan bir marta.
(function () {
  var tg = false;
  try {
    tg = !!window.TelegramWebviewProxy || /tgWebApp/.test(location.hash) ||
      /tgWebAppData/.test(sessionStorage.getItem('__telegram__initParams') || '');
  } catch (e) {}
  if (!tg) return;
  var t = document.getElementById('botTugma');
  t.textContent = window.I18N ? I18N.t('Qayta urinish') : 'Qayta urinish';
  t.href = 'index.html' + location.hash;
  var oxirgi = 0;
  try { oxirgi = +sessionStorage.getItem('bs_kerak_qaytish') || 0; } catch (e) {}
  if (Date.now() - oxirgi > 20000) {
    try { sessionStorage.setItem('bs_kerak_qaytish', String(Date.now())); } catch (e) {}
    location.replace('index.html' + location.hash);
  }
})();
</script>

</body>
</html>
